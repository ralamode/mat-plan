# Squawk — migration linter (GAP-3 PR 1b).
#
# AGENTS.md has listed Squawk as a required check for months; it was never wired
# (audited 2026-09-23, docs/tech-debt.md). GAP-3's arc ends in a DROP COLUMN on a
# column with live data, so the gate lands before that arc rather than after.

pg_version = "17.0"

# LOAD-BEARING. `packages/db/scripts/migrate.ts` uses drizzle's stock migrator,
# which runs every PENDING migration inside ONE transaction (drizzle-orm 0.45.4,
# pg-core/dialect.js; not one per file, as this comment once said). Without this, Squawk assumes
# no transaction and `prefer-robust-stmts` fires 99 times spuriously — 188 issues
# rather than 33. If a runner that applies a file outside the transaction (for
# CREATE INDEX CONCURRENTLY) is ever built, this flag becomes a lie for those
# files and those 99 findings come back.
assume_in_transaction = true

excluded_rules = [
  # Domain integers — idx, reps, seconds, superset_order — are deliberately int4.
  # These are ordinals and small counts, not identity columns.
  "prefer-bigint-over-int",
]

# `require-concurrent-index-creation` is ON (maintainer, 2026-11-20). CONCURRENTLY
# cannot run inside drizzle's single migrate transaction, and no runner applies a
# file outside it, so a new migration cannot satisfy the rule. Each plain
# CREATE INDEX on a table that already exists therefore carries
#   -- squawk-ignore require-concurrent-index-creation
# on the line directly above it, with its reason above that. The written reason
# IS the gate. Squawk does not flag an index on a table the same file creates.
# Migrations 0001-0026 hold 27 such indexes from when the rule was excluded;
# Squawk lints added files only, so they never reach it (docs/tech-debt.md).
