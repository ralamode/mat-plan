name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the gitleaks job widens to read PRs.
permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # base.sha must be diffable; the default shallow checkout has no base,
          # and a `git diff` with nothing to compare against would make the guard
          # below silently ALWAYS PASS — worse than no guard. `gitleaks` already
          # uses fetch-depth: 0 on an 8.7MB repo, so this is precedent, not cost.
          fetch-depth: 0

      # ── Action pins (SEC-2; .github/SECURITY.md → "Supply chain") ──────────
      # Every `uses:` is pinned to a commit SHA with a bare `# vX.Y.Z`; a tag can be
      # moved by whoever controls it. migrate.yml only runs AFTER merge, so GitHub's
      # own run-time pin setting would let a tag-pinned edit merge green and then
      # stop prod migrations. Only a pre-merge check catches that.
      #
      # First, right after checkout, so a pin failure shows even when a later guard
      # fails. It can't check the checkout above it (itself one of the pins checked).
      # Plain node, no install. A step in `quality`, not a job, for the reason the
      # feature-guides step gives below.
      #
      # `--resolve` asks GitHub whether each SHA IS its version tag's commit, which
      # defeats a fork's "imposter" commit. It runs only on push and on PRs that touch
      # a workflow or this guard: a bad pin can only arrive that way, and an API
      # outage then can't turn unrelated PRs red. The skip is step-level (AGENTS.md).
      - name: Action pins (SHA + version; resolved against GitHub when workflows change)
        env:
          GH_TOKEN: ${{ github.token }} # read-only; lifts the 60/h anonymous API limit
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          resolve=--resolve
          if [ -n "$BASE_SHA" ]; then
            # Captured first, so a failing `git diff` aborts the step (bash -e) instead of
            # reading as "no workflow changed" and silently dropping --resolve.
            changed="$(git diff --name-only "$BASE_SHA" HEAD -- \
              .github/workflows .github/scripts/check-action-pins.mjs)"
            [ -z "$changed" ] && resolve= # no workflow touched: the offline check is enough
          fi
          node .github/scripts/check-action-pins.mjs $resolve

      # ── Forward-only migrations (AGENTS.md → DB rules) ──────────────────────
      # A migration already on main has run against prod and its SQL is hashed in
      # __drizzle_migrations, so editing/renaming/deleting one makes the repo and
      # prod diverge SILENTLY. Only ADDED files are allowed here.
      #
      # AGENTS.md has claimed this gate for months; it was never wired (audited
      # 2026-09-23, docs/tech-debt.md). GAP-3 is the first migration arc ending in
      # a destructive step, so it lands before that arc starts.
      #
      # `meta/_journal.json` is the ONE exception — every new migration appends an
      # entry, so it is `M` on 100% of DB PRs and a naive `migrations/**` rule
      # would fail every one of them. It is excluded from the path check and
      # verified APPEND-ONLY instead, or the exclusion becomes a hole through
      # which an applied migration's `tag` could be rewritten.
      #
      # Lives in `quality` (not its own job) so it blocks merges immediately with
      # no branch-protection change, and sits before pnpm/Node so it fails in
      # seconds rather than after install + test.
      - name: Forward-only migration guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MIG=packages/db/migrations
          JOURNAL="$MIG/meta/_journal.json"

          # --no-renames: a rename reports as R100 by default, which could be
          # mis-paired with a genuinely new migration. Forcing D+A trips the D.
          # Renames MUST fail — the journal `tag` maps 1:1 to the filename.
          # Snapshots are EXCLUDED from the immutability check, deliberately, and it is a
          # narrower hole than it looks. A `.sql` file is applied to prod and HASHED in
          # `__drizzle_migrations`, so editing one makes prod and the repo diverge silently —
          # that stays strictly add-only. A `meta/*_snapshot.json` is drizzle's local diffing
          # state: never applied, never hashed, never read by prod. Blocking its repair meant a
          # CORRUPT snapshot could not be fixed at all (see the chain check below, and #147).
          # Two things still cover it: the drift guard (`generate` must leave a clean tree)
          # catches a snapshot that disagrees with schema.ts, and the chain check below catches
          # a broken parent link — which is the failure this exclusion exists to let us repair.
          CHANGED=$(git diff --name-status --no-renames --diff-filter=DMRTC \
            "$BASE_SHA...HEAD" -- "$MIG" ":(exclude)$JOURNAL" \
            ":(exclude)$MIG/meta/*_snapshot.json")

          JOURNAL_BAD=''
          if git cat-file -e "$BASE_SHA:$JOURNAL" 2>/dev/null; then
            OLD=$(git show "$BASE_SHA:$JOURNAL" | jq -c '.entries')
            NEW=$(git show "HEAD:$JOURNAL" | jq -c '.entries')
            if [ "$(jq -n --argjson o "$OLD" --argjson n "$NEW" '$n[:($o|length)] == $o')" != 'true' ]; then
              JOURNAL_BAD=1
            fi
          fi

          # ── Snapshot chain integrity ────────────────────────────────────────
          # Each snapshot's `prevId` must be the PREVIOUS snapshot's `id`. drizzle only walks
          # this chain when APPENDING, so a broken link is invisible — `generate` reports "No
          # schema changes" and `db:verify` passes — until the next migration dies with
          # "are pointing to a parent snapshot ... which is a collision".
          #
          # Exactly that shipped in #139 and sat on main undetected: merging two generated
          # migrations and promoting the second snapshot to the first's filename leaves
          # `prevId === id`, a self-reference. Checked here so the class cannot recur, and
          # checked on EVERY PR (not just ones touching migrations) because the break is
          # introduced by one PR and only surfaces in a later, unrelated one.
          CHAIN_BAD=''
          PREV_ID=''
          for SNAP in $(ls "$MIG"/meta/[0-9]*_snapshot.json 2>/dev/null | sort); do
            SNAP_ID=$(jq -r '.id' "$SNAP")
            SNAP_PREV=$(jq -r '.prevId' "$SNAP")
            if [ -n "$PREV_ID" ] && [ "$SNAP_PREV" != "$PREV_ID" ]; then
              CHAIN_BAD="$CHAIN_BAD\n  $(basename "$SNAP"): prevId=$SNAP_PREV, expected $PREV_ID"
            fi
            if [ "$SNAP_PREV" = "$SNAP_ID" ]; then
              CHAIN_BAD="$CHAIN_BAD\n  $(basename "$SNAP"): prevId === id (self-referential)"
            fi
            PREV_ID="$SNAP_ID"
          done

          if [ -z "$CHANGED" ] && [ -z "$JOURNAL_BAD" ] && [ -z "$CHAIN_BAD" ]; then
            echo "Forward-only guard OK — no applied migration modified, snapshot chain intact."
            exit 0
          fi

          if [ -n "$CHAIN_BAD" ]; then
            printf 'Broken snapshot chain:%b\n' "$CHAIN_BAD"
            cat <<'CHAINMSG'

          Each meta/NNNN_snapshot.json must have prevId == the PREVIOUS snapshot's id.
          drizzle only walks this chain when appending, so a break is silent until the
          NEXT migration fails to generate. Fix by setting the offending prevId to the
          id of the snapshot before it — the snapshot files are NOT applied to prod and
          are safe to repair.
          CHAINMSG
          fi

          if [ -n "$CHANGED" ]; then
            echo "Modified/deleted/renamed migration artifacts:"
            echo "$CHANGED"
          fi
          if [ -n "$JOURNAL_BAD" ]; then
            echo "meta/_journal.json rewrote existing entries (it is append-only)."
          fi
          if [ -n "$CHANGED" ] || [ -n "$JOURNAL_BAD" ]; then
          cat <<'MSG'

          Migrations on main have already been applied to production and their SQL
          is hashed in __drizzle_migrations — editing, renaming or deleting one
          makes prod and the repo diverge silently. Fix forward instead:

            1. git checkout origin/main -- packages/db/migrations
            2. edit packages/db/src/schema.ts
            3. pnpm --filter @mat-plan/db db:generate   # emits a NEW 00NN_*.sql

          Destructive shape changes go expand -> backfill -> contract across
          separate deploys. Only ADDED (A) files are allowed under this directory
          (meta/*_snapshot.json excepted — see the comment on the check).
          MSG
          fi
          echo '::error::Forward-only / snapshot-chain violation in packages/db/migrations (see log; AGENTS.md — DB rules).'
          exit 1

      # ── Squawk: lint NEW migrations ────────────────────────────────────────
      # AGENTS.md has listed Squawk as required for months; it was never wired
      # (audited 2026-09-23). It blocks the shapes that rule names — DROP COLUMN /
      # TABLE, TRUNCATE CASCADE, RENAME — which is exactly how GAP-3's contract
      # step gets caught rather than merged.
      #
      # ADDED FILES ONLY (--diff-filter=A). All-files is not viable: 20 findings
      # remain across 6 migrations already on main, and Squawk has no baseline or
      # suppression feature. Scoping to added files composes with the forward-only
      # guard above — that makes migrations add-only, so "added" IS "new".
      #
      # The 20 pre-existing findings are therefore never linted. They are known and
      # reasoned, not a backlog: 0009's own comment names the Squawk objection and
      # justifies it (the column is created in the same statement, so every row is
      # NULL and the validating scan reads rows that cannot fail). Recorded in
      # docs/tech-debt.md so the gate does not silently imply main is clean.
      #
      # In `quality`, not its own job — a new job is not a REQUIRED check until
      # branch protection is edited, so it would look wired while blocking nothing.
      # Same reasoning as the forward-only guard above.
      - name: Squawk (new migrations)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Piped to xargs rather than joined into a space-separated string: a
          # `tr '\n' ' '` leaves a TRAILING SPACE, which bash word-splits away but
          # zsh passes through as part of the filename. That makes the step pass in
          # CI and fail for anyone reproducing locally — caught by simulating this
          # against a real commit before shipping. xargs behaves identically in both.
          LIST=$(git diff --name-only --diff-filter=A "$BASE_SHA...HEAD" \
                   -- 'packages/db/migrations/*.sql')
          if [ -z "$LIST" ]; then
            echo "No new migrations — Squawk skipped."
            exit 0
          fi
          echo "::notice::Squawk linting:"; echo "$LIST"
          # Pinned, never @latest: a new rule in a patch release must not turn an
          # unrelated PR red.
          printf '%s\n' "$LIST" | xargs npx --yes squawk-cli@2.66.0 -c .squawk.toml

      # ── Feature guides must move with the code they document ──────────────
      # Each guide in docs/features/ declares the files it OWNS. Touching an owned
      # file without touching its guide fails here — so a guide cannot drift from
      # the feature it describes, and the NEXT change to that feature costs one
      # read instead of an afternoon of tracing.
      #
      # WHY A GATE: AGENTS.md claimed five required CI checks for months that did
      # not exist (docs/tech-debt.md, audited 2026-09-23). A doc nobody is forced
      # to update is a doc that lies — and a lying guide is worse than none,
      # because it gets trusted instead of verified.
      #
      # In `quality`, not its own job: a new job needs its own branch-protection
      # entry before it can block, while a step rides with `quality`. (Today NO
      # check is required — AGENTS.md → "CI checks" — so this is about DX-5.)
      #
      # Needs no pnpm/node install: plain node + git, and it runs BEFORE the setup
      # steps so a docs-only miss fails in seconds rather than after a full build.
      - name: Feature guides (docs/features)
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'docs-skip-feature-map')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-feature-guides.mjs "$BASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: DB drift guard + migration/seed verify
        run: |
          pnpm --filter @mat-plan/db db:generate
          git diff --exit-code packages/db/migrations \
            || (echo '::error::Schema drift — run `pnpm --filter @mat-plan/db db:generate` and commit.' && exit 1)
          pnpm --filter @mat-plan/db db:verify

      - name: Build
        run: pnpm build
        env:
          # lib/env.ts validates at build; values are non-secret CI placeholders.
          ACCESS_GATE_PASSWORD: ci-build-placeholder
          DATABASE_URL: postgres://user:pass@localhost:5432/db

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # `pull-requests: read` lets the guard list a PR's changed files (auto-skip).
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mat
          POSTGRES_PASSWORD: mat
          POSTGRES_DB: mat_plan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mat -d mat_plan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral CI Postgres — no PgBouncer, so pooled and unpooled point at the
      # SAME local instance. Non-secret placeholders; migrations never touch prod.
      DATABASE_URL: postgres://mat:mat@localhost:5432/mat_plan_test
      DATABASE_URL_UNPOOLED: postgres://mat:mat@localhost:5432/mat_plan_test
      ACCESS_GATE_PASSWORD: ci-e2e-placeholder-1234
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The smoke is SKIPPED (heavy steps gated) but the job still SUCCEEDS in two
      # cases — so once `e2e` is a required check (planned at V0/PR-28), neither
      # path ever hard-blocks a merge by leaving the check "pending". We never use
      # a job-level `if:`/`paths-ignore` (that would leave the required check
      # unreported); the job always runs, only the heavy steps are conditional.
      #   1. MANUAL: the `ci-skip-e2e` label — for a known-flaky or e2e-irrelevant
      #      change that DOES touch code. Escalation beyond that: admin merge.
      #   2. AUTOMATIC: every changed file in the PR is provably inert (docs /
      #      tooling only — see INERT below), so the smoke has nothing to prove.
      #      Conservative + default-to-run: any file outside the allowlist (app,
      #      packages, workflows, config, lockfile) forces the smoke to run.
      - name: Resolve e2e override
        id: guard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            let skip = false;
            let reason = '';

            const labels = (pr?.labels ?? []).map((l) => l.name);
            if (labels.includes('ci-skip-e2e')) {
              skip = true;
              reason = 'ci-skip-e2e label';
            }

            // Auto-skip only on PRs (a push to main always runs the smoke).
            if (!skip && pr) {
              const INERT = [
                /^docs\//, // all docs (incl. plans, lessons, ADRs)
                /^[^/]+\.md$/, // root-level markdown (README, AGENTS, …)
                /^\.claude\//, // agent tooling: skills, settings
                /^\.github\/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/,
                /^\.github\/SECURITY\.md$/,
                /^LICENSE$/,
                /\.(png|jpe?g|gif|svg|webp|ico)$/i,
              ];
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const names = files.map((f) => f.filename);
              // Default to RUN: skip only if there is at least one file and EVERY
              // one is inert. An empty list (shouldn't happen) runs the smoke.
              if (names.length > 0 && names.every((f) => INERT.some((re) => re.test(f)))) {
                skip = true;
                reason = `docs/tooling-only change — ${names.length} file(s), all inert`;
              }
            }

            if (skip) {
              core.notice(`e2e smoke skipped (${reason}); job still reports success.`);
            }
            core.setOutput('skip', skip ? 'true' : 'false');

      - name: Setup pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Migrate + seed ephemeral Postgres (reuse packages/db scripts)
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm --filter @mat-plan/db db:migrate
          pnpm --filter @mat-plan/db db:seed

      - name: Playwright smoke
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter web e2e

      - name: Upload report + traces on failure
        if: failure() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
