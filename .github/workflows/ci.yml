name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the gitleaks job widens to read PRs.
permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: DB drift guard + migration/seed verify
        run: |
          pnpm --filter @mat-plan/db db:generate
          git diff --exit-code packages/db/migrations \
            || (echo '::error::Schema drift — run `pnpm --filter @mat-plan/db db:generate` and commit.' && exit 1)
          pnpm --filter @mat-plan/db db:verify

      - name: Build
        run: pnpm build
        env:
          # lib/env.ts validates at build; values are non-secret CI placeholders.
          ACCESS_GATE_PASSWORD: ci-build-placeholder
          DATABASE_URL: postgres://user:pass@localhost:5432/db

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mat
          POSTGRES_PASSWORD: mat
          POSTGRES_DB: mat_plan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mat -d mat_plan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral CI Postgres — no PgBouncer, so pooled and unpooled point at the
      # SAME local instance. Non-secret placeholders; migrations never touch prod.
      DATABASE_URL: postgres://mat:mat@localhost:5432/mat_plan_test
      DATABASE_URL_UNPOOLED: postgres://mat:mat@localhost:5432/mat_plan_test
      ACCESS_GATE_PASSWORD: ci-e2e-placeholder-1234
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Migrate + seed ephemeral Postgres (reuse packages/db scripts)
        run: |
          pnpm --filter @mat-plan/db db:migrate
          pnpm --filter @mat-plan/db db:seed

      - name: Playwright smoke
        run: pnpm --filter web e2e

      - name: Upload report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
