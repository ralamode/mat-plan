name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the gitleaks job widens to read PRs.
permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: DB drift guard + migration/seed verify
        run: |
          pnpm --filter @mat-plan/db db:generate
          git diff --exit-code packages/db/migrations \
            || (echo '::error::Schema drift — run `pnpm --filter @mat-plan/db db:generate` and commit.' && exit 1)
          pnpm --filter @mat-plan/db db:verify

      - name: Build
        run: pnpm build
        env:
          # lib/env.ts validates at build; values are non-secret CI placeholders.
          ACCESS_GATE_PASSWORD: ci-build-placeholder
          DATABASE_URL: postgres://user:pass@localhost:5432/db

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
