name: Migrate + seed (production)

# GitHub Actions is the SINGLE migrator (AGENTS.md DB rules): it applies pending
# migrations against the DIRECT/unpooled Neon string on merge to main — NEVER in
# the Vercel build (concurrent preview builds would race / DDL the wrong DB).
# Additive/expand migrations are backward-compatible, so racing the Vercel deploy
# is safe; destructive contract steps are gated behind a later, separate deploy.
#
# Runs on EVERY push to main (no path filter) so reference-data changes — a new
# catalog row in seed.ts or @mat-plan/shared — reach prod even when the PR has no
# migration. OPS-2 PR 1: production's seed writes REFERENCE DATA ONLY (no household,
# no athlete, no program); those are fixtures, written only behind the fixtures flag,
# which this workflow never sets (apps/web/test/seed-fixtures-is-contained.test.ts).
# This is drift-proof: `db:migrate` is a no-op when nothing is pending, and `db:seed` is
# idempotent (ON CONFLICT DO NOTHING; `units` is upserted only where it differs). A brittle per-file
# `paths` allowlist would silently miss seed-only PRs (which is exactly how prod
# drifted after V1-2/V1-3 shipped no migration).
#
# CAT-3 A2-ii: the reference data includes the movement library (`CATALOG_MOVEMENTS`), written in one
# transaction. The first push after A2-ii inserts it; every later push inserts nothing, but still
# sends the insert, and each absorbed row uses up a `movements` identity value (harmless on a bigint;
# docs/lessons.md -> Database). A library entry the database refuses turns this job red until a
# fix-forward PR: docs/runbooks.md -> "The seed fails on the movement library".
#
# TEN-2c: "safe to always run" is unqualified again. `db:seed` used to REFUSE — and so
# turn this job red on every subsequent push — if a household already owned a `movements`
# row whose slug the seed adds globally, because while the non-partial `movements_slug_unique`
# lived, `ON CONFLICT DO NOTHING` absorbed that collision and the catalog row was silently
# never inserted. Migration 0017 dropped that constraint, so the two rows now coexist legally
# and the global insert lands. The guard REPORTS instead: it seeds the curated row and logs a
# warning with COUNTS ONLY (CAT-3 A2-i) — never a slug a household also holds, never a row's
# `name`, because this log is world-readable. Background: docs/runbooks.md -> "the seed's shadow
# guard fired".
#
# The PREVIEW estate has its own migrator, `migrate-preview.yml` — a separate FILE, not a second job
# here, so that a branch dispatch cannot reach the production credential below (OPS-1).

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger — re-seed / re-apply prod on demand

# Never cancel an in-flight migration; serialize runs against main.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: apply migrations
    runs-on: ubuntu-latest
    # OPS-1: `workflow_dispatch` lets a caller pick ANY ref, and a dispatched run executes that
    # ref's code — so without this, dispatching from a feature branch would apply that branch's
    # unmerged, unreviewed migration files to PRODUCTION. runbooks.md has always said to dispatch
    # from `main`; this makes the instruction unnecessary rather than merely written down. A push to
    # `main` and a dispatch from `main` both satisfy it, so the documented procedure is unchanged.
    if: github.ref == 'refs/heads/main'
    # OPS-2 PR 1: PROD_DATABASE_URL_UNPOOLED is an ENVIRONMENT secret of "Production" (the maintainer,
    # 2026-11-18), so only a job that declares this environment can read it. That environment's
    # deployment-branch policy must be "main only" (docs/runbooks.md -> "Rotate or rename the
    # production database secret"). No older version of this file declares it, so an old run re-run
    # from the Actions tab cannot read the secret even before the old one is deleted.
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply migrations + idempotent seed (direct/unpooled Neon string)
        env:
          # 🔴 OPS-2 PR 1 (D-S2, the maintainer's decision, 2026-11-18): the production string is read
          # from a RENAMED secret, `PROD_DATABASE_URL_UNPOOLED`, and the old `DATABASE_URL_UNPOOLED` is
          # deleted once this file's first run is green. From then on, an OLD run re-run from the Actions
          # tab reads the old name, finds it empty and exits 0 with a warning (every older version of
          # this step did), so it cannot re-seed production with code that wrote households. The env var
          # keeps its old name: the scripts read DATABASE_URL_UNPOOLED. Steps: docs/runbooks.md ->
          # "Rotate or rename the production database secret".
          DATABASE_URL_UNPOOLED: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}
          # OPS-1: there are now TWO migrator secrets, so a mis-paste is live in both directions —
          # and this is the QUIET direction: the preview string here would leave this job GREEN
          # while production stopped being migrated and drifted. Both scripts refuse a target whose
          # database name disagrees. See packages/shared/src/db-environment.ts.
          EXPECTED_DB_ENV: production
        run: |
          # OPS-2 PR 1: absent is an ERROR now, not a skip. Production is wired, and since the rename a
          # missing secret means the operator has not created PROD_DATABASE_URL_UNPOOLED: skipping
          # would leave this job green while no migration reached production.
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::PROD_DATABASE_URL_UNPOOLED is not set, so production cannot be migrated or seeded. Create it (docs/runbooks.md -> \"Rotate or rename the production database secret\")."
            exit 1
          fi
          pnpm --filter @mat-plan/db db:migrate
          pnpm --filter @mat-plan/db db:seed
