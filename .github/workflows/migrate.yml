name: Migrate + seed (production)

# GitHub Actions is the SINGLE migrator (AGENTS.md DB rules): it applies pending
# migrations against the DIRECT/unpooled Neon string on merge to main — NEVER in
# the Vercel build (concurrent preview builds would race / DDL the wrong DB).
# Additive/expand migrations are backward-compatible, so racing the Vercel deploy
# is safe; destructive contract steps are gated behind a later, separate deploy.
#
# Runs on EVERY push to main (no path filter) so reference-data changes — a new
# catalog row / profile in seed.ts or @mat-plan/shared — reach prod even when the
# PR has no migration. This is drift-proof and safe to always run: `db:migrate` is
# a no-op when nothing is pending, and `db:seed` is idempotent (ON CONFLICT DO
# NOTHING). A brittle per-file `paths` allowlist would silently miss seed-only PRs
# (which is exactly how prod drifted after V1-2/V1-3 shipped no migration).

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger — re-seed / re-apply prod on demand

# Never cancel an in-flight migration; serialize runs against main.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: apply migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply migrations + idempotent seed (direct/unpooled Neon string)
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::warning::DATABASE_URL_UNPOOLED secret not set — skipping (Neon not wired yet)."
            exit 0
          fi
          pnpm --filter @mat-plan/db db:migrate
          pnpm --filter @mat-plan/db db:seed
