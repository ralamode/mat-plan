name: Secret scan (main)

# Main's secret scan, one run per commit (DX-18 D6 as revised, 2026-11-19). `ci.yml`'s pushes to main
# coalesce, so a dropped run's commits would never be scanned there: gitleaks-action scans only the
# push event's own commits (`commits[0]^..head`). This workflow keeps a group per SHA, never shared,
# and it takes about 13s. Pull requests are scanned by `ci.yml`'s gitleaks job.

on:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # nothing here fetches or pushes

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
