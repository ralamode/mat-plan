packages:
  - 'apps/*'
  - 'packages/*'

# Native deps allowed to run install/build scripts (pnpm 11 blocks these by default and
# HARD-ERRORS in CI). sharp = Next image optimization; unrs-resolver = ESLint import resolver;
# esbuild = bundler behind drizzle-kit / tsx / pglite (needs its postinstall to fetch its binary).
# @embedded-postgres/* = the throwaway Postgres binary for the ephemeral screenshot DB (its
# postinstall rehydrates shared-lib symlinks so `postgres` can start); the platform package that
# installs varies by OS — allow every dev/CI platform so a frozen install never hard-errors.
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  # @sentry/cli: DELIBERATELY false. Its postinstall downloads a ~20MB binary used ONLY to upload
  # source maps at build time. We disable source-map upload entirely (see next.config.ts), so the
  # binary is dead weight in every install — including CI, which is the exact complaint already logged
  # against @embedded-postgres in docs/tech-debt.md. Trade-off: Sentry stack frames are minified.
  # Acceptable for a 3-user app; flip this AND `sourcemaps.disable` together if traces prove unreadable.
  '@sentry/cli': false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Transitive advisories we pin ahead of the upstream bump. Each entry names the advisory and the
# path, so it can be removed the moment the parent ships a fixed range (check with `pnpm why <pkg>`).
overrides:
  # GHSA-68fv-2mgg-jv7q (high) — event-loop DoS via indexed source-map section offsets.
  # Reached production through next > postcss > source-map-js and @sentry/nextjs > next > ... .
  # postcss's range still admits <1.2.2; drop this once it doesn't.
  source-map-js: '>=1.2.2'
  # GHSA-2w6q-fjjm-54f4 + GHSA-9jm3-4fm8-q4qc (moderate) — isInSubnet() and a parse diagnostic.
  # Dev-only, via the `shadcn` CLI > @modelcontextprotocol/sdk > express-rate-limit, which declares
  # `^10.2.0`. The real fix is the SDK bump upstream; this is in-range until then.
  ip-address: '>=10.7.1'
