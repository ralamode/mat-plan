packages:
  - 'apps/*'
  - 'packages/*'

# Native deps allowed to run install/build scripts (pnpm 11 blocks these by default and
# HARD-ERRORS in CI). sharp = Next image optimization; unrs-resolver = ESLint import resolver;
# esbuild = bundler behind drizzle-kit / tsx / pglite (needs its postinstall to fetch its binary).
# @embedded-postgres/* = the throwaway Postgres binary for the ephemeral screenshot DB (its
# postinstall rehydrates shared-lib symlinks so `postgres` can start); the platform package that
# installs varies by OS — allow every dev/CI platform so a frozen install never hard-errors.
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  # @sentry/cli: DELIBERATELY false. Its postinstall downloads a ~20MB binary used ONLY to upload
  # source maps at build time. We disable source-map upload entirely (see next.config.ts), so the
  # binary is dead weight in every install — including CI, which is the exact complaint already logged
  # against @embedded-postgres in docs/tech-debt.md. Trade-off: Sentry stack frames are minified.
  # Acceptable for a 3-user app; flip this AND `sourcemaps.disable` together if traces prove unreadable.
  '@sentry/cli': false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Transitive advisories we pin ahead of the upstream bump. Each entry names the advisory and the
# path, so it can be removed the moment the parent ships a fixed range (check with `pnpm why <pkg>`).
overrides:
  # GHSA-68fv-2mgg-jv7q (high) — event-loop DoS via indexed source-map section offsets.
  # Reached production through next > postcss > source-map-js and @sentry/nextjs > next > ... .
  # postcss's range still admits <1.2.2; drop this once it doesn't.
  source-map-js: '>=1.2.2'
  # GHSA-587h-7wmj-h5pm (high) — `launch-editor`'s `fs.existsSync()` existence check is bypassable
  # on Windows. It is reached through vite's dev-server "open in editor" overlay, so the real-world
  # exposure here is nil: we build on Linux, deploy to Vercel's Node runtime, and never start a vite
  # dev server in CI or production.
  #
  # It is pinned anyway because it reached the PRODUCTION tree for the first time in this bump:
  # @sentry/nextjs 11.8.0 adds @sentry/cloudflare, which depends on vite. We never import the
  # Cloudflare path, but `pnpm audit --prod` cannot see that and should not be asked to.
  #
  # BARE, not scoped, and unlike the zod entry below that is the right call: vite resolves to ONE
  # version across this tree (the prod path and the vitest dev chain alike), so there is no second
  # major to drag — and the dev chain gets patched too.
  #
  # ⚠️ `>=8.1.6` is a FLOOR, not a pin: pnpm takes the newest satisfying release, which is how this
  # resolved to 8.3.5 rather than the 8.1.6 the advisory names. That is the same shape as the two
  # entries above it, and `pnpm verify` is what certifies the jump (1340 tests green on it). Drop the
  # entry once @sentry/cloudflare's own range excludes <8.1.6.
  vite: '>=8.1.6'
  # GHSA-2w6q-fjjm-54f4 + GHSA-9jm3-4fm8-q4qc (moderate) — isInSubnet() and a parse diagnostic.
  # Dev-only, via the `shadcn` CLI > @modelcontextprotocol/sdk > express-rate-limit, which declares
  # `^10.2.0`. The real fix is the SDK bump upstream; this is in-range until then.
  # Still needed after the SDK reached 1.32.1: express-rate-limit@8.7.0 still declares `^10.2.0`,
  # and shadcn > socks@2.8.10 declares `^10.1.1`. Drop it once neither range admits <10.7.1.
  ip-address: '>=10.7.1'
  # GHSA-mrhx-c7xc-m3w5 / CVE-2023-54404 (HIGH, CVSS 8.2) — memory-exhaustion DoS: `$ZodArray`
  # accumulates an issue object per failing element with no cap, so an oversized untrusted array
  # against an unbounded array schema can OOM the process. Patched in 4.6.6.
  #
  # ⚠️ SCOPED, not a bare `zod:` entry, and that matters: a blanket override would drag the shadcn
  # CLI's chain (@modelcontextprotocol/sdk, zod-to-json-schema, both built against zod 3) across a
  # MAJOR version. Only the Vercel path is vulnerable.
  #
  # Reached the production tree through @vercel/functions > @vercel/oidc > @vercel/cli-config, which
  # pins `zod: 4.1.11` EXACTLY — so bumping @vercel/functions does not help: 3.10.3 (latest) still
  # resolves cli-config 0.3.3, which still pins 4.1.11. An override is the only lever.
  #
  # Our OWN zod is already 4.6.7, so every Server Action and shared schema was always patched; the
  # vulnerable copy only serves cli-config's local-config reading, which parses no untrusted arrays.
  # The gate is deliberately blunt about the --prod tree, and that is right: "low exposure" is an
  # argument for calm, not for an exception. Drop this once cli-config's pin clears 4.6.6.
  '@vercel/cli-config>zod': '>=4.6.6'
