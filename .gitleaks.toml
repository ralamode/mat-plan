# gitleaks config — extends the default ruleset and allowlists intentionally
# committed, non-secret CI placeholders. These are NOT credentials.
#
# 🔴 **Both strings were ACCESS_GATE_PASSWORD values, and AUTH-1 1d deleted that variable — but the
# entries STAY, and removing them would turn gitleaks RED.** They are quoted verbatim in
# docs/lessons.md (the "gitleaks red on a CI placeholder" entry, which is live guidance about
# choosing low-entropy placeholders) and in two dated plan docs that are history and are not
# rewritten. So the allowlist now covers DOCUMENTATION of a retired variable rather than live CI env.
# ⚠️ Do not "tidy" them out on the grounds that ci.yml no longer sets them.
#
# Keep the allowlist tight (specific strings), not a blanket path exclusion, so
# a real secret accidentally added to these files is still caught.
title = "mat-plan"

[extend]
useDefault = true

[allowlist]
description = "Non-secret placeholder values, now surviving only in documentation"
regexTarget = "line"
regexes = [
  '''ci-e2e-placeholder-1234''',
  '''ci-build-placeholder''',
]
