<meta charset="utf-8" />
<title>Fix It Yourself prototype</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
/>
<!--
  CRUD-1 prototype — docs/specs/crud-1-fix-it-yourself.md.
  Standalone on purpose: NOT under apps/web/app/, so it cannot trip pages-are-gated.test.ts or
  collide with AUTH-1. No build, no dependencies, no data leaves the page. Every name is a fixture.
  Tokens mirror apps/web/app/globals.css (:root / .dark) so widths and contrast read like the app.
-->
<style>
  /* Layout: a review bar on top, then the app rendered inside a device frame of a chosen width. */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --stage: oklch(0.955 0.004 250);
    --note: oklch(0.97 0.03 85);
    --note-fg: oklch(0.38 0.06 70);
    --measure: oklch(0.6 0.2 300);
    --radius: 0.625rem;
    --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
      --stage: oklch(0.1 0.004 250);
      --note: oklch(0.27 0.03 85);
      --note-fg: oklch(0.88 0.06 85);
      --measure: oklch(0.72 0.17 300);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --stage: oklch(0.1 0.004 250);
    --note: oklch(0.27 0.03 85);
    --note-fg: oklch(0.88 0.06 85);
    --measure: oklch(0.72 0.17 300);
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
  }
  button,
  input,
  select {
    font: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ── review bar ─────────────────────────────────────────────── */
  .bar-wrap {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .bar-sum {
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 13px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (max-width: 600px) {
    .bar-wrap {
      position: static;
    }
  }
  .bar {
    padding-block: 0 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    font-size: 13px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: var(--background);
  }
  .bar strong {
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .bar label {
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  .bar select {
    min-height: 32px;
    border: 1px solid var(--input);
    border-radius: 6px;
    background: var(--background);
    padding: 0 6px;
    max-width: 230px;
  }
  .bar .chk {
    min-height: 32px;
  }
  .bar button {
    min-height: 32px;
    border: 1px solid var(--input);
    border-radius: 6px;
    background: var(--background);
    padding: 0 10px;
    cursor: pointer;
  }
  .stage {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
    padding-block: 24px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .device {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 18px;
    max-width: 100%;
    min-height: 640px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 1px 2px oklch(0 0 0 / 6%),
      0 12px 32px oklch(0 0 0 / 8%);
  }
  .device-cap {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted-foreground);
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  @media (max-width: 480px) {
    .stage {
      padding-left: 0;
      padding-right: 0;
      padding-block: 0 48px;
    }
    .device {
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      width: 100% !important;
    }
  }
  .notes {
    width: 340px;
    max-width: 100%;
    background: var(--note);
    color: var(--note-fg);
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
  }
  .notes h2 {
    margin: 0 0 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .notes ul {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .notes code {
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* ── the app, mirroring apps/web classes ────────────────────── */
  .app {
    display: flex;
    flex-direction: column;
    gap: 32px;
    padding: 32px 16px 48px; /* main: px-4 py-12, trimmed */
  }
  .app h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .app h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
  }
  .app h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .stack-sm {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stack-xs {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .muted {
    color: var(--muted-foreground);
  }
  .small {
    font-size: 14px;
  }
  .xs {
    font-size: 12px;
  }
  .tabular {
    font-variant-numeric: tabular-nums;
  }
  ul.plain {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    width: fit-content;
    color: var(--muted-foreground);
    font-size: 14px;
    text-decoration: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .back:hover,
  .textlink:hover {
    color: var(--foreground);
  }
  .textlink {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    width: fit-content;
    color: var(--muted-foreground);
    font-size: 14px;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .btn[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn.outline {
    background: var(--background);
    color: var(--foreground);
    border-color: var(--input);
  }
  .btn.ghost {
    background: transparent;
    color: var(--foreground);
    padding: 0 12px;
  }
  .btn.ghost:hover,
  .btn.outline:hover {
    background: var(--accent);
  }
  .btn.danger {
    background: var(--destructive);
    color: oklch(0.985 0 0);
  }
  .btn.danger-ghost {
    background: transparent;
    color: var(--destructive);
    padding: 0 12px;
  }
  .btn.full {
    width: 100%;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    padding: 16px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field > span {
    font-size: 14px;
    font-weight: 500;
  }
  .input {
    height: 44px;
    border-radius: 8px;
    border: 1px solid var(--input);
    background: var(--background);
    padding: 0 12px;
    font-size: 16px;
    width: 100%;
  }
  .hint {
    font-size: 13px;
    color: var(--muted-foreground);
  }
  .err {
    font-size: 13px;
    color: var(--destructive);
  }
  fieldset {
    border: 0;
    margin: 0;
    padding: 0;
  }
  legend {
    font-size: 14px;
    font-weight: 500;
    padding: 0;
    margin-bottom: 6px;
  }
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .seg label {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--input);
    border-radius: 8px;
    cursor: pointer;
  }
  .seg input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
  }
  .seg label:has(input:checked) {
    border-color: var(--foreground);
  }

  /* picker tiles — profile-tile.tsx */
  .tile {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 96px;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--card);
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent);
    color: inherit;
    text-decoration: none;
    width: 100%;
    border: 0;
    text-align: left;
    cursor: pointer;
  }
  .tile:hover {
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 22%, transparent);
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 999px;
    background: var(--primary);
    color: var(--primary-foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 600;
    flex: none;
  }
  .tile .name {
    font-size: 18px;
    font-weight: 500;
  }
  .tile .kind {
    font-size: 14px;
    color: var(--muted-foreground);
    text-transform: capitalize;
  }
  .tile.add {
    box-shadow: none;
    border: 2px dashed color-mix(in oklch, var(--foreground) 28%, transparent);
    background: transparent;
  }
  .tile.add .avatar {
    background: transparent;
    color: var(--foreground);
    border: 2px dashed color-mix(in oklch, var(--foreground) 28%, transparent);
    font-weight: 400;
  }
  .tile-wrap {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .tile-wrap .tile {
    flex: 1;
    min-width: 0;
  }
  .tile-edit {
    min-width: 72px;
  }

  /* day page */
  .daynav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .daynav .day {
    font-weight: 500;
    font-size: 15px;
    text-align: center;
    flex: 1;
  }
  .entry {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px; /* px-4 py-3 */
  }
  .entry .body {
    flex: 1;
    min-width: 0;
  }
  .entry .title {
    font-weight: 500;
  }
  .entry .detail {
    font-size: 14px;
    color: var(--muted-foreground);
    overflow-wrap: anywhere;
  }
  .entry .del {
    margin: -8px -10px -8px 0;
  }
  .hidden-row {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 4px 4px 4px 16px;
  }
  .hidden-row > .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .hidden-list {
    padding: 4px 12px 12px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hidden-item {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .hidden-item .body {
    min-width: 0;
    flex: 1;
  }
  .refusal {
    border-left: 3px solid var(--destructive);
    padding: 8px 12px;
    background: color-mix(in oklch, var(--destructive) 8%, transparent);
    border-radius: 0 8px 8px 0;
    font-size: 14px;
  }
  .ok-msg {
    border-left: 3px solid var(--foreground);
    padding: 8px 12px;
    background: var(--muted);
    border-radius: 0 8px 8px 0;
    font-size: 14px;
  }
  .setrow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .setrow .idx {
    width: 20px;
    font-size: 14px;
    color: var(--muted-foreground);
    text-align: right;
  }
  .setrow .num {
    width: 96px;
  }
  .movement-btn {
    height: 44px;
    border-radius: 8px;
    border: 1px solid var(--input);
    background: var(--background);
    padding: 0 12px;
    text-align: left;
    width: 100%;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .movement-btn .placeholder {
    color: var(--muted-foreground);
  }

  /* sheet (picker) */
  dialog {
    border: 0;
    padding: 0;
    background: var(--background);
    color: var(--foreground);
    border-radius: 16px;
    width: min(520px, calc(100vw - 16px));
    max-height: calc(100dvh - 32px);
  }
  dialog::backdrop {
    background: oklch(0 0 0 / 45%);
  }
  .sheet-in {
    display: flex;
    flex-direction: column;
    max-height: calc(100dvh - 32px);
  }
  .sheet-head {
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-body {
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .group-label {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    font-weight: 600;
    margin: 4px 0;
  }
  .opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    min-height: 48px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }
  .opt:hover,
  .opt[aria-selected='true'] {
    background: var(--accent);
  }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  .suggest {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* program editor */
  .rx {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rx-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .rx-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .icon-btn {
    min-width: 44px;
    min-height: 44px;
    border-radius: 8px;
    border: 1px solid var(--input);
    background: var(--background);
    cursor: pointer;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--muted);
  }
  .banner {
    border: 1px solid var(--border);
    background: var(--muted);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
  }
  .timeline {
    list-style: none;
    margin: 0;
    padding: 0 0 0 16px;
    border-left: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .timeline li {
    position: relative;
  }
  .timeline li::before {
    content: '';
    position: absolute;
    left: -23px;
    top: 6px;
    width: 12px;
    height: 12px;
    border-radius: 999px;
    background: var(--background);
    border: 2px solid var(--foreground);
  }
  .timeline li.past::before {
    border-color: var(--muted-foreground);
  }
  .checkrow {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .checkrow input {
    width: 20px;
    height: 20px;
    accent-color: var(--primary);
    flex: none;
  }
  .checkrow:has(input:checked) {
    border-color: var(--foreground);
  }
  details.collapse > summary {
    min-height: 44px;
    display: flex;
    align-items: center;
    cursor: pointer;
    color: var(--muted-foreground);
    font-size: 14px;
  }
  .proto-flag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--note-fg);
    background: var(--note);
    border-radius: 6px;
    padding: 2px 6px;
    width: fit-content;
  }

  /* measurement overlay */
  .measuring [data-m] {
    outline: 1px dashed var(--measure);
    outline-offset: -1px;
    position: relative;
  }
  .m-tag {
    position: absolute;
    right: 0;
    top: -14px;
    font: 500 10px/1 var(--font-mono);
    color: var(--background);
    background: var(--measure);
    padding: 2px 4px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 5;
  }
  @media (prefers-reduced-motion: no-preference) {
    .flash {
      animation: flash 1.2s ease-out;
    }
    @keyframes flash {
      from {
        background: var(--accent);
      }
    }
  }
</style>

<details class="bar-wrap" id="bar-wrap" open>
  <summary class="bar-sum">
    <strong>CRUD-1 prototype</strong> <span class="muted">· review controls</span>
  </summary>
  <div class="bar" role="region" aria-label="Prototype controls">
    <label for="screen-select"
      >Screen
      <select id="screen-select"></select>
    </label>
    <label for="width-select"
      >Width
      <select id="width-select">
        <option value="360">360 · small phone</option>

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

      var d = new Date(iso + 'T12:00:00');

        'en-US',
        long

          : { month: 'short', day: 'numeric' },
      );
    }
    function shift(iso, n) {
      var d = new Date(iso + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }
    function nowLabel() {

      var live = document.getElementById('live');

      var day = onDay || TODAY;
      return S.assignments.filter(function (x) {

          return { name: 'clone', step: 1 };

          return { name: 'history', id: 'a1' };

          return { name: 'movements' };

          slot: 'bw',

    function openPicker() {

    function lev(a, b) {
      var m = [];
      for (var i = 0; i <= b.length; i++) m[i] = [i];
      for (var j = 0; j <= a.length; j++) m[0][j] = j;
      for (i = 1; i <= b.length; i++)
        for (j = 1; j <= a.length; j++)
          m[i][j] =
            b[i - 1] === a[j - 1]
              ? m[i - 1][j - 1]
              : Math.min(m[i - 1][j - 1] + 1, m[i][j - 1] + 1, m[i - 1][j] + 1);
      return m[b.length][a.length];
    }
    function norm(s) {
      return s
        .toLowerCase()
        .replace(/[^a-z0-9 ]/g, ' ')
        .replace(/s\b/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }
    function opt(name, tag) {
      return (
        '<button type="button" role="option" class="opt" data-act="pick" data-name="' +
        esc(name) +
        '"><span>' +
        esc(name) +
        '</span>' +
        (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') +
        '</button>'
      );
    }
    function drawPicker(q) {
      var list = document.getElementById('pk-list');
      var all = [];
      Object.keys(CATALOG).forEach(function (g) {
        CATALOG[g].forEach(function (n) {
          all.push({ name: n, group: g });
        });
      });
      S.householdMovements.forEach(function (h) {
        all.push({ name: h.name, group: 'Added by your household', hh: true });
      });
      var html = '';
      if (!q) {
        var prog = program('b1').days['Day A'].map(function (p) {
          return p.name;
        });
        html +=
          '<div><div class="group-label">Today’s program · Day A</div>' +
          prog
            .map(function (n) {
              return opt(n);
            })
            .join('') +
          '</div>';
        html +=
          '<div><div class="group-label">Recent</div>' +
          ['Overhead Shoulder Press', 'Back Squat']
            .map(function (n) {
              return opt(n);
            })
            .join('') +
          '</div>';
        Object.keys(CATALOG).forEach(function (g) {
          html +=
            '<div><div class="group-label">' +
            g +
            (PROPOSED[g] ? ' · proposed' : '') +
            '</div>' +
            CATALOG[g]
              .map(function (n) {
                return opt(n, PROPOSED[g] ? 'pending review' : '');
              })
              .join('') +
            '</div>';
        });
        html +=
          '<div><div class="group-label">Added by your household</div>' +
          S.householdMovements
            .map(function (h) {
              return opt(h.name, 'household');
            })
            .join('') +
          '</div>';
        list.innerHTML = html;
        return;
      }
      var nq = norm(q);
      var hits = all.filter(function (x) {
        return norm(x.name).indexOf(nq) !== -1;
      });
      var exact = all.some(function (x) {
        return norm(x.name) === nq;
      });
      if (hits.length) {
        html +=
          '<div><div class="group-label">Matches</div>' +
          hits
            .map(function (x) {
              return opt(x.name, x.hh ? 'household' : x.group);
            })
            .join('') +
          '</div>';
      }
      if (!exact) {
        // PICK-2: nearest catalog rows + spelling fixes, shown BEFORE create; never blocking.
        var near = all
          .filter(function (x) {
            return !x.hh;
          })
          .map(function (x) {
            return { x: x, d: lev(norm(x.name), nq) };
          })
          .filter(function (o) {
            return o.d <= Math.max(3, Math.floor(nq.length / 4));
          })
          .sort(function (a, b) {
            return a.d - b.d;
          })
          .slice(0, 2);
        var fixes = [];
        q.toLowerCase()
          .split(/\s+/)
          .forEach(function (w) {
            if (!w || WORDS.indexOf(w) !== -1) return;
            var best = WORDS.map(function (c) {
              return { c: c, d: lev(c, w) };
            }).sort(function (a, b) {
              return a.d - b.d;
            })[0];
            if (best && best.d > 0 && best.d <= 2) fixes.push([w, best.c]);
          });
        if (near.length || fixes.length) {
          html +=
            '<div class="suggest" role="group" aria-label="Did you mean"><div class="group-label" style="margin:0">Did you mean</div>' +
            near
              .map(function (o) {
                return opt(o.x.name, 'catalog');
              })
              .join('');
          if (fixes.length) {
            var fixed = q.toLowerCase();
            fixes.forEach(function (f) {
              fixed = fixed.replace(f[0], f[1]);
            });
            fixed = fixed.replace(/\b\w/g, function (c) {
              return c.toUpperCase();
            });
            var known = all.find(function (x) {
              return norm(x.name) === norm(fixed);
            });
            html +=
              '<p class="small" style="margin:0">Spelling: ' +
              fixes
                .map(function (f) {
                  return '<s>' + esc(f[0]) + '</s> → <strong>' + esc(f[1]) + '</strong>';
                })
                .join(', ') +
              '</p>' +
              (known
                ? opt(known.name, known.hh ? 'household' : 'catalog')
                : '<button type="button" role="option" class="opt" data-act="pick-new" data-name="' +
                  esc(fixed) +
                  '"><span>' +
                  esc(fixed) +
                  '</span><span class="tag">new · fixed spelling</span></button>');
          }
          html += '</div>';
        }
        html +=
          '<button type="button" class="btn outline full" data-act="pick-new" data-name="' +
          esc(q) +
          '">Use “' +
          esc(q) +
          '” as typed</button><p class="hint" style="margin:0">Creates a new movement only your household sees.</p>';
      }
      list.innerHTML = html;
    }

    // ── measurement overlay ──────────────────────────────────────────────────
    function measure() {
      var on = document.getElementById('measure').checked;
      var app = document.getElementById('app');
      app.classList.toggle('measuring', on);
      app.querySelectorAll('.m-tag').forEach(function (t) {
        t.remove();
      });
      if (!on) return;
      app.querySelectorAll('[data-m]').forEach(function (el) {
        var w = el.getBoundingClientRect().width;
        var cs = getComputedStyle(el);
        var inner =
          w -
          parseFloat(cs.paddingLeft) -
          parseFloat(cs.paddingRight) -
          parseFloat(cs.borderLeftWidth) -
          parseFloat(cs.borderRightWidth);
        var tag = document.createElement('span');
        tag.className = 'm-tag';
        tag.setAttribute('aria-hidden', 'true');
        tag.textContent =
          Math.round(w) +
          (Math.round(inner) !== Math.round(w) ? ' / ' + Math.round(inner) + ' in' : '') +
          'px';
        if (cs.position === 'static') el.style.position = 'relative';
        el.appendChild(tag);
      });
    }

    // ── events ───────────────────────────────────────────────────────────────
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-go],[data-act]');
      if (!t) return;
      var go_ = t.getAttribute('data-go');
      if (go_) {
        if (go_ === 'day')
          return go({ name: 'day', id: t.dataset.id || 'a1', day: TODAY, keepMsg: false });
        if (go_ === 'edit') return go({ name: 'edit', id: t.dataset.id });
        if (go_ === 'del') return go({ name: 'del', id: t.dataset.id, step: 1 });
        if (go_ === 'log' || go_ === 'program' || go_ === 'history')
          return go({ name: go_, id: t.dataset.id || 'a1' });
        if (go_ === 'clone') {
          S.clone = null;
          return go({ name: 'clone', step: 1, b: t.dataset.b || 'b1' });
        }
        if (go_ === 'programs') S.flash = null;
        return go({ name: go_ });
      }
      var act = t.getAttribute('data-act');
      var r = S.route;
      if (act === 'hide') return hide(t.dataset.k, t.dataset.eid);
      if (act === 'restore') return restore(t.dataset.k, +t.dataset.ei);
      if (act === 'toggle-hidden') {
        r.openHidden = !r.openHidden;
        save();
        render();
        document.getElementById('hid-toggle').focus();
        return;
      }
      if (act === 'day') {
        r.day = shift(r.day, +t.dataset.n);
        S.restoreMsg = null;
        r.openHidden = false;
        save();
        render();
        var b = document.querySelector('[data-act="day"][data-n="' + t.dataset.n + '"]');
        if (b && !b.disabled) b.focus();
        return;
      }
      if (act === 'clear-open') return openClear();
      if (act === 'dlg-close') {
        document.getElementById('dlg').close();
        return;
      }
      if (act === 'open-picker') return openPicker();
      if (act === 'pick' || act === 'pick-new') {
        S.form.movement = { name: t.dataset.name, created: act === 'pick-new' };
        if (act === 'pick-new')
          S.householdMovements.push({ name: t.dataset.name, uses: 0, near: '—' });
        document.getElementById('dlg').close();
        save();
        render();
        document.querySelector('.movement-btn').focus();
        announce('Movement: ' + t.dataset.name);
        return;
      }
      if (act === 'archive-athlete') {
        athlete(t.dataset.id).archived = true;
        announce(athlete(t.dataset.id).name + ' archived.');
        return go({ name: 'settings' });
      }
      if (act === 'unarchive') {
        athlete(t.dataset.id).archived = false;
        save();
        render();
        announce('Restored.');
        return;
      }
      if (act === 'del-step') return go({ name: 'del', id: t.dataset.id, step: +t.dataset.step });
      if (act === 'del-final') {
        var nm = athlete(t.dataset.id).name;
        S.athletes = S.athletes.filter(function (a) {
          return a.id !== t.dataset.id;
        });
        return go({ name: 'del', step: 4, deleted: nm });
      }
      if (act === 'mv' || act === 'rm') {
        var rows =
          t.dataset.b === 'copy'
            ? S.clone.days[t.dataset.day]
            : program(t.dataset.b).days[t.dataset.day];
        var i = +t.dataset.i;
        var label = rows[i].name;
        if (act === 'rm') rows.splice(i, 1);
        else {
          var j = i + +t.dataset.d;
          var tmp = rows[i];
          rows[i] = rows[j];
          rows[j] = tmp;
        }
        save();
        render();
        announce(act === 'rm' ? label + ' removed.' : label + ' moved.');
        return;
      }
      if (act === 'add-rx') {
        program(t.dataset.b).days[t.dataset.day].push(rx('Bulgarian Split Squat'));
        save();
        render();
        return;
      }
      if (act === 'archive-prog') {
        r.confirmArchive = t.dataset.b;
        save();
        render();
        return;
      }
      if (act === 'archive-cancel') {
        r.confirmArchive = null;
        save();
        render();
        return;
      }
      if (act === 'archive-go') {
        var b = program(t.dataset.b);
        b.archived = true;
        var closed = [];
        S.assignments.forEach(function (x) {
          if (x.block === b.id && !x.to) {
            x.to = shift(TODAY, -1);
            closed.push(athlete(x.athlete).name);
          }
        });
        S.flash =
          esc(b.name) +
          ' archived.' +
          (closed.length ? ' ' + esc(closed.join(' and ')) + ' stopped getting it today.' : '') +
          ' <button type="button" class="btn ghost" data-act="unarchive-prog" data-b="' +
          b.id +
          '">Undo</button>';
        r.confirmArchive = null;
        save();
        render();
        return;
      }
      if (act === 'unarchive-prog') {
        program(t.dataset.b).archived = false;
        S.flash =
          esc(program(t.dataset.b).name) +
          ' restored. Re-assign athletes from the program if they should be on it again.';
        save();
        render();
        return;
      }
      if (act === 'clone-step') return go({ name: 'clone', step: +t.dataset.step, b: S.clone.src });
      if (act === 'hist-pick') {
        S.histDate = t.dataset.d;
        document.getElementById('v-hist').value = 'date';
        return go({ name: 'history', id: r.id });
      }
      if (act === 'merge') {
        var m = S.householdMovements.splice(+t.dataset.i, 1)[0];
        save();
        render();
        announce(m.name + ' merged into ' + m.near + '.');
        return;
      }
    });

        ].find(function (x) {

        S.histDate = ev.target.value || S.histDate;
        save();
        render();
        document.getElementById('hist-d').focus();

    document.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var f = ev.target;
      if (f.id === 'add-form') {
        var name = document.getElementById('add-name').value.trim();
        if (!name) {
          document.getElementById('add-err').hidden = false;
          document.getElementById('add-name').setAttribute('aria-invalid', 'true');
          document.getElementById('add-name').setAttribute('aria-describedby', 'add-err');
          document.getElementById('add-name').focus();
          return;
        }
        var id = 'a' + Date.now();
        S.athletes.push({
          id: id,
          name: name,
          kind: f.querySelector('input[name=kind]:checked').value,
          archived: false,
        });
        announce(name + ' added.');
        return go({ name: 'day', id: id, day: TODAY });
      }
      if (f.id === 'edit-form') {
        var a = athlete(f.dataset.id);
        var nm = document.getElementById('edit-name').value.trim();
        if (nm) a.name = nm;
        a.kind = f.querySelector('input[name=ekind]:checked').value;
        announce('Saved.');
        return go({
          name: document.getElementById('v-delete').value === 'picker' ? 'picker' : 'settings',
        });
      }
      if (f.id === 'del-form') return go({ name: 'del', id: f.dataset.id, step: 3 });
      if (f.id === 'clear-form') return clearDay(f.dataset.k);
      if (f.id === 'bw-form') {
        var v = document.getElementById('bw-in').value.trim();
        if (!v) return;
        S.entries[f.dataset.k] = [
          {
            id: 'e' + Date.now(),
            title: 'Bodyweight',
            detail: v + ' lb · ' + nowLabel(),
            slot: 'bw',
          },
        ].concat(S.entries[f.dataset.k] || []);
        save();
        render();
        announce('Bodyweight saved.');
        return;
      }
      if (f.id === 'clone-1') {
        S.clone.name = document.getElementById('cl-name').value.trim() || S.clone.name;
        return go({ name: 'clone', step: 2, b: S.clone.src });
      }
      if (f.id === 'clone-3') {
        var c = S.clone;
        var nb = { id: 'b' + Date.now(), name: c.name, archived: false, days: c.days };
        S.programs.push(nb);
        var moved = [];
        Object.keys(c.move).forEach(function (aid) {
          if (!c.move[aid]) return;
          S.assignments.forEach(function (x) {
            if (x.athlete === aid && x.block === c.src && !x.to) x.to = shift(TODAY, -1);
          });
          S.assignments.push({ athlete: aid, block: nb.id, from: TODAY, to: null });
          moved.push(athlete(aid).name);
        });
        c.summary = moved.length
          ? esc(moved.join(' and ')) +
            (moved.length > 1 ? ' move' : ' moves') +
            ' to ' +
            esc(c.name) +
            ' from today. ' +
            esc(program(c.src).name) +
            ' keeps everything logged on it.'
          : null;
        return go({ name: 'clone', step: 4, b: c.src });
      }
    });

    function hide(k, eid) {
      var list = S.entries[k];
      var i = list.findIndex(function (e) {
        return e.id === eid;
      });
      var e = list.splice(i, 1)[0];
      S.hidden[k] = (S.hidden[k] || []).concat([{ at: nowLabel(), items: [e] }]);
      S.restoreMsg = null;
      save();
      render();
      // Focus: the next row's Delete, else the Hidden row's control (acceptance 11). Never the previous
      // row's Delete: a second Enter would hide a row the person never looked at.
      var dels = document.querySelectorAll('#entries [data-act="hide"]');
      var target = dels[i] || document.getElementById('hid-toggle');
      if (target) target.focus();
      announce(e.title + ' deleted. Restore it from Hidden on this day.');
    }
    function clearDay(k) {
      var list = S.entries[k] || [];
      S.hidden[k] = (S.hidden[k] || []).concat([{ at: nowLabel(), items: list.slice() }]);
      S.entries[k] = [];
      document.getElementById('dlg').close();
      S.route.openHidden = true;
      // The prototype's partial-restore case: a weigh-in logged after clearing takes the slot.
      if (
        list.some(function (e) {
          return e.slot === 'bw';
        })
      )
        S.entries[k].push({
          id: 'e' + Date.now(),
          title: 'Bodyweight',
          detail: '111.9 lb · logged after clearing',
          slot: 'bw',
        });
      save();
      render();
      var b = document.querySelector('[data-act="restore"]');
      if (b) b.focus();
      announce(
        'Day cleared. ' + list.length + ' entries hidden. Restore them from Hidden on this day.',
      );
    }
    function restore(k, ei) {
      var ev = S.hidden[k][ei];
      var live = S.entries[k] || (S.entries[k] = []);
      var back = [];
      var refused = [];
      ev.items.forEach(function (e) {
        var held =
          e.slot &&
          live.find(function (x) {
            return x.slot === e.slot;
          });
        if (held) refused.push([e, held]);
        else back.push(e);
      });
      back.forEach(function (e) {
        live.push(e);
      });
      if (refused.length)
        ev.items = refused.map(function (p) {
          return p[0];
        });
      else S.hidden[k].splice(ei, 1);
      if (!S.hidden[k].length) delete S.hidden[k];
      if (refused.length) {
        var f = refused[0];
        S.restoreMsg =
          '<div class="refusal" role="alert">' +
          (back.length
            ? 'Restored ' + back.length + ' of ' + (back.length + refused.length) + '. '
            : '') +
          '<strong>' +
          esc(f[0].title) +
          ' (' +
          esc(f[0].detail.split(' · ')[0]) +
          ')</strong> can’t come back: ' +
          esc(f[1].detail.split(' · ')[0]) +
          ' is already logged for this day. Delete that one first, then restore this.</div>';
      } else {
        S.restoreMsg = null;
        S.route.openHidden = !!S.hidden[k];
      }
      save();
      render();
      var focusEl = document.querySelector('.refusal')
        ? document.querySelector('[data-act="restore"]')
        : document.querySelector('#entries [data-act="hide"]');
      if (focusEl) focusEl.focus();
      announce(
        refused.length
          ? 'Could not restore ' +
              refused
                .map(function (p) {
                  return p[0].title;
                })
                .join(', ') +
              '.'
          : 'Restored ' +
              back
                .map(function (e) {
                  return e.title;
                })
                .join(', ') +
              '.',
      );
    }

    // ── bar ──────────────────────────────────────────────────────────────────
    var sel = document.getElementById('screen-select');
    SCREENS.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s[0];
      o.textContent = s[1];
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      go(screenToRoute(sel.value));
    });
    function setWidth() {
      var w = document.getElementById('width-select').value;
      document.getElementById('device').style.width = w + 'px';
      document.getElementById('cap-w').textContent = w + 'px';
      measure();
    }
    document.getElementById('width-select').addEventListener('change', setWidth);
    ['v-delete', 'v-archive', 'v-hist'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', function () {
        S.editMode = false;
        render();
      });
    });
    document.getElementById('measure').addEventListener('change', measure);
    document.getElementById('reset').addEventListener('click', function () {
      S = fresh();
      save();
      render();
      announce('Prototype data reset.');
    });
    document.getElementById('app').addEventListener('click', function (ev) {
      if (ev.target.id === 'edit-toggle') {
        S.editMode = !S.editMode;
        save();
        render();
        document.getElementById('edit-toggle').focus();
      }
    });
    document.addEventListener(
      'toggle',
      function (ev) {
        if (ev.target.id === 'arch-d') S.archivedOpen = ev.target.open;
      },
      true,
    );
    window.addEventListener('resize', measure);

    if (window.innerWidth <= 600) document.getElementById('bar-wrap').open = false;

    // Open the view named by a plain #anchor (artifact viewers pass only bare tokens).
    var start = (location.hash || '').replace('#', '');
    if (
      start &&
      SCREENS.some(function (s) {
        return s[0] === start;
      })
    )
      S.route = screenToRoute(start);
    render();
  })();
</script>
