<meta charset="utf-8" />
<title>Fix It Yourself prototype</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
/>
<!--
  CRUD-1 prototype (v2, after UX panel round 1) — docs/specs/crud-1-fix-it-yourself.md.
  Standalone on purpose: NOT under apps/web/app/, so it cannot trip pages-are-gated.test.ts or
  collide with AUTH-1. No build, no dependencies, no data leaves the page. Every name is a fixture.
  Tokens mirror apps/web/app/globals.css (:root / .dark) so widths and contrast read like the app.
-->
<style>
  /* Layout: a review bar on top, then the app rendered inside a device frame of a chosen width. */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --stage: oklch(0.955 0.004 250);
    --note: oklch(0.97 0.03 85);
    --note-fg: oklch(0.38 0.06 70);
    --measure: oklch(0.6 0.2 300);
    --radius: 0.625rem;
    --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
      --stage: oklch(0.1 0.004 250);
      --note: oklch(0.27 0.03 85);
      --note-fg: oklch(0.88 0.06 85);
      --measure: oklch(0.72 0.17 300);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --stage: oklch(0.1 0.004 250);
    --note: oklch(0.27 0.03 85);
    --note-fg: oklch(0.88 0.06 85);
    --measure: oklch(0.72 0.17 300);
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
  }
  button,
  input,
  select {
    font: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ── review bar ─────────────────────────────────────────────── */
  .bar-wrap {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .bar-sum {
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 13px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (max-width: 600px) {
    .bar-wrap {
      position: static;
    }
  }
  .bar {
    padding-block: 0 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    font-size: 13px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: var(--background);
  }
  .bar strong {
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .bar label {
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  .bar select {
    min-height: 32px;
    border: 1px solid var(--input);
    border-radius: 6px;
    background: var(--background);
    padding: 0 6px;
    max-width: 230px;
  }
  .bar .chk {
    min-height: 32px;
  }
  .bar button {
    min-height: 32px;
    border: 1px solid var(--input);
    border-radius: 6px;
    background: var(--background);
    padding: 0 10px;
    cursor: pointer;
  }
  .stage {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
    padding-block: 24px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .device {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 18px;
    max-width: 100%;
    min-height: 640px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 1px 2px oklch(0 0 0 / 6%),
      0 12px 32px oklch(0 0 0 / 8%);
  }
  .device-cap {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted-foreground);
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  @media (max-width: 480px) {
    .stage {
      padding-left: 0;
      padding-right: 0;
      padding-block: 0 48px;
    }
    .device {
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      width: 100% !important;
    }
  }
  .notes {
    width: 340px;
    max-width: 100%;
    background: var(--note);
    color: var(--note-fg);
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
  }
  .notes h2 {
    margin: 0 0 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .notes ul {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .notes code {
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* ── the app, mirroring apps/web classes ────────────────────── */
  .app {
    display: flex;
    flex-direction: column;
    gap: 32px;
    padding: 32px 16px 48px; /* main: px-4 py-12, trimmed */
    max-width: 42rem; /* max-w-2xl, as p/page.tsx and [profileId]/page.tsx use (CD-8) */
    margin: 0 auto;
  }
  .app h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .app h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
  }
  .app h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .stack-sm {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stack-xs {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .muted {
    color: var(--muted-foreground);
  }
  .small {
    font-size: 14px;
  }
  .xs {
    font-size: 12px;
  }
  .tabular {
    font-variant-numeric: tabular-nums;
  }
  ul.plain {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    width: fit-content;
    color: var(--muted-foreground);
    font-size: 14px;
    text-decoration: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .back:hover,
  .textlink:hover {
    color: var(--foreground);
  }
  .textlink {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    width: fit-content;
    color: var(--muted-foreground);
    font-size: 14px;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .btn[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn.outline {
    background: var(--background);
    color: var(--foreground);
    border-color: var(--input);
  }
  .btn.ghost {
    background: transparent;
    color: var(--foreground);
    padding: 0 12px;
  }
  .btn.ghost:hover,
  .btn.outline:hover {
    background: var(--accent);
  }
  .btn.danger {
    background: var(--destructive);
    color: oklch(0.985 0 0);
  }
  .btn.danger-ghost {
    background: transparent;
    color: var(--destructive);
    padding: 0 12px;
  }
  .btn.full {
    width: 100%;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    padding: 16px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field > span {
    font-size: 14px;
    font-weight: 500;
  }
  .input {
    height: 44px;
    border-radius: 8px;
    border: 1px solid var(--input);
    background: var(--background);
    padding: 0 12px;
    font-size: 16px;
    width: 100%;
  }
  .hint {
    font-size: 13px;
    color: var(--muted-foreground);
  }
  .err {
    font-size: 13px;
    color: var(--destructive);
  }
  fieldset {
    border: 0;
    margin: 0;
    padding: 0;
  }
  legend {
    font-size: 14px;
    font-weight: 500;
    padding: 0;
    margin-bottom: 6px;
  }
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .seg label {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--input);
    border-radius: 8px;
    cursor: pointer;
  }
  .seg input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
  }
  .seg label:has(input:checked) {
    border-color: var(--foreground);
  }
  /* Weekday toggles. 7 × 44px = 308px > the 294px of content at 360px, so one row cannot hold them
     at a legal tap size. auto-fill on a 64px minimum sizes to the CONTAINER, not the viewport: 4 + 3 in
     294px, 7 across from 496px. (v3 keyed this on a viewport media query and overflowed inside the
     360px device frame on a wide screen — the real sheet is narrower than the window too.) */
  .days {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 8px;
  }
  .days label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    border: 1px solid var(--input);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .days input {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
  }
  .days label:has(input:checked) {
    border-color: var(--foreground);
    font-weight: 500;
  }
  .preview {
    font-size: 13px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 12px;
    margin: 0;
  }
  .preview dt {
    color: var(--muted-foreground);
  }
  .preview dd {
    margin: 0;
  }

  /* picker tiles — profile-tile.tsx */
  .tile {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 96px;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--card);
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent);
    color: inherit;
    text-decoration: none;
    width: 100%;
    border: 0;
    text-align: left;
    cursor: pointer;
  }
  .tile:hover {
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 22%, transparent);
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 999px;
    background: var(--primary);
    color: var(--primary-foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 600;
    flex: none;
  }
  .tile .name {
    font-size: 18px;
    font-weight: 500;
  }
  .tile .kind {
    font-size: 14px;
    color: var(--muted-foreground);
    text-transform: capitalize;
  }
  .tile.add {
    box-shadow: none;
    border: 2px dashed color-mix(in oklch, var(--foreground) 28%, transparent);
    background: transparent;
  }
  .tile.add .avatar {
    background: transparent;
    color: var(--foreground);
    border: 2px dashed color-mix(in oklch, var(--foreground) 28%, transparent);
    font-weight: 400;
  }
  .tile-wrap {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .tile-wrap .tile {
    flex: 1;
    min-width: 0;
  }
  .tile-edit {
    min-width: 72px;
  }

  /* day page */
  .daynav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .daynav .day {
    font-weight: 500;
    font-size: 15px;
    text-align: center;
    flex: 1;
  }
  .entry {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px; /* px-4 py-3 */
  }
  .entry .body {
    flex: 1;
    min-width: 0;
  }
  .entry .title {
    font-weight: 500;
  }
  .entry .detail {
    font-size: 14px;
    color: var(--muted-foreground);
    overflow-wrap: anywhere;
  }
  .entry .del {
    margin: -8px -10px -8px 0;
  }
  .hidden-row {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 4px 4px 4px 16px;
  }
  .hidden-row > .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .hidden-list {
    padding: 4px 12px 12px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hidden-item {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .hidden-item .body {
    min-width: 0;
    flex: 1;
  }
  .refusal {
    border-left: 3px solid var(--destructive);
    padding: 8px 12px;
    background: color-mix(in oklch, var(--destructive) 8%, transparent);
    border-radius: 0 8px 8px 0;
    font-size: 14px;
  }
  .ok-msg {
    border-left: 3px solid var(--foreground);
    padding: 8px 12px;
    background: var(--muted);
    border-radius: 0 8px 8px 0;
    font-size: 14px;
  }
  .setrow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .setrow .idx {
    width: 20px;
    font-size: 14px;
    color: var(--muted-foreground);
    text-align: right;
  }
  .setrow .num {
    width: 96px;
  }
  .movement-btn {
    height: 44px;
    border-radius: 8px;
    border: 1px solid var(--input);
    background: var(--background);
    padding: 0 12px;
    text-align: left;
    width: 100%;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .movement-btn .placeholder {
    color: var(--muted-foreground);
  }

  /* sheet (picker) */
  dialog {
    border: 0;
    padding: 0;
    background: var(--background);
    color: var(--foreground);
    border-radius: 16px;
    width: min(520px, calc(100vw - 16px));
    max-height: calc(100dvh - 32px);
  }
  dialog::backdrop {
    background: oklch(0 0 0 / 45%);
  }
  .sheet-in {
    display: flex;
    flex-direction: column;
    max-height: calc(100dvh - 32px);
  }
  .sheet-head {
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-body {
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .group-label {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    font-weight: 600;
    margin: 4px 0;
  }
  .opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    min-height: 48px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }
  .opt:hover,
  .opt[aria-selected='true'] {
    background: var(--accent);
  }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  .suggest {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* program editor */
  .rx {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rx-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .rx-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .icon-btn {
    min-width: 44px;
    min-height: 44px;
    border-radius: 8px;
    border: 1px solid var(--input);
    background: var(--background);
    cursor: pointer;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--muted);
  }
  .banner {
    border: 1px solid var(--border);
    background: var(--muted);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
  }
  .timeline {
    list-style: none;
    margin: 0;
    padding: 0 0 0 16px;
    border-left: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .timeline li {
    position: relative;
  }
  .timeline li::before {
    content: '';
    position: absolute;
    left: -23px;
    top: 6px;
    width: 12px;
    height: 12px;
    border-radius: 999px;
    background: var(--background);
    border: 2px solid var(--foreground);
  }
  .timeline li.past::before {
    border-color: var(--muted-foreground);
  }
  .checkrow {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .checkrow input {
    width: 20px;
    height: 20px;
    accent-color: var(--primary);
    flex: none;
  }
  .checkrow:has(input:checked) {
    border-color: var(--foreground);
  }
  details.collapse > summary {
    min-height: 44px;
    display: flex;
    align-items: center;
    cursor: pointer;
    color: var(--muted-foreground);
    font-size: 14px;
  }
  .proto-flag {

    // Q13. "calendar": today's resolveRotationSlot — floorMod(isoDayDiff(day, anchor), n). "scheduled"
    // (proposed): count the athlete's SCHEDULED days from the anchor instead. Both are pure functions of
    // the date and the schedule, so a skipped session never shifts the program (the maintainer's rule,
    // 2026-10-22). With all seven days scheduled the two are identical, which is today's YDP.
    function slotFor(b, days, iso) {
      var rot = b.rotation || { anchor: '2026-09-24', slots: Object.keys(b.days) };
      var n = rot.slots.length;
      var c;
      if ($('#v-rotation').value === 'calendar') {
        c = Math.round((Date.parse(iso) - Date.parse(rot.anchor)) / 864e5);

      return rot.slots[((c % n) + n) % n];

    // FE-4: closed form — full weeks × |set|, plus the remainder — never a day-by-day walk, so the
    // 60,000-date proof stays cheap. Signed: negative before the anchor.
    function scheduledBetween(from, to, days) {
      var n = Math.round((Date.parse(to) - Date.parse(from)) / 864e5);
      var sign = 1;
      if (n < 0) {
        var t = from;
        from = to;
        to = t;
        n = -n;
        sign = -1;
      }
      var c = Math.floor(n / 7) * days.length;
      var w0 = weekday(from);
      for (var i = 0; i < n % 7; i++) if (days.indexOf((w0 + i) % 7) !== -1) c++;
      return sign * c;
    }

    function lev(a, b) {
      var m = [];
      for (var i = 0; i <= b.length; i++) m[i] = [i];
      for (var j = 0; j <= a.length; j++) m[0][j] = j;
      for (i = 1; i <= b.length; i++)
        for (j = 1; j <= a.length; j++)
          m[i][j] =
            b[i - 1] === a[j - 1]
              ? m[i - 1][j - 1]
              : Math.min(m[i - 1][j - 1] + 1, m[i][j - 1] + 1, m[i - 1][j] + 1);
      return m[b.length][a.length];
    }
    function norm(s) {
      return fold(s)
        .replace(/[^a-z0-9 ]/g, ' ')
        .replace(/(\w{3,})s\b/g, '$1')
        .replace(/\s+/g, ' ')
        .trim();
    }
    function optBase(name, tag) {
      return (
        '<li><button type="button" class="opt" data-act="pick" data-name="' +
        esc(name) +

        '</button></li>'

    function group(id, label, inner) {

    var lastStatus = '';
    function drawPicker(q) {
      var list = $('#pk-list');
      var foot = $('#pk-foot');
      var all = [];
      Object.keys(CATALOG).forEach(function (g) {
        CATALOG[g].forEach(function (n) {
          all.push({ name: n, group: g });
        });
      });
      S.householdMovements.forEach(function (h) {
        all.push({ name: h.name, group: 'Your household', hh: true });
      });
      // In the editor, say what the day already has (a repeat is legal: warm-up + working sets).
      var inDay = pickCtx
        ? S.edit.blocks[pickCtx.b][pickCtx.day]
            .filter(function (p) {
              return !p.removed;
            })
            .map(function (p) {
              return p.name;
            })
        : [];
      function opt(name, tag) {
        return optBase(name, inDay.indexOf(name) !== -1 ? 'already in ' + pickCtx.day : tag);
      }
      var html = '';
      var status = '';
      if (!q) {
        html += group(
          'recent',
          'Recent',
          ['Overhead Shoulder Press', 'Back Squat', 'Pull-Up']
            .map(function (n) {
              return opt(n);
            })
            .join(''),
        );
        Object.keys(CATALOG).forEach(function (g) {
          html += group(
            g,
            g,
            CATALOG[g]
              .map(function (n) {
                return opt(n);
              })
              .join(''),
          );
        });
        html += group(
          'hh',
          'Added by your household',
          S.householdMovements
            .map(function (h) {
              return opt(h.name, 'added by you');
            })
            .join(''),
        );
        if (!pickCtx)
          html +=
            '<details class="collapse"><summary>Today’s program (already on your form)</summary><ul class="plain">' +
            program('b1')
              .days['Strength B'].map(function (p) {
                return opt(p.name);
              })
              .join('') +
            '</ul></details>';
        list.innerHTML = html;
        foot.hidden = true;
        return;
      }
      var nq = norm(q);
      var alias = ALIASES[q.toLowerCase().trim()];
      var hits = all.filter(function (x) {
        return norm(x.name).indexOf(nq) !== -1;
      });
      if (
        alias &&
        !hits.some(function (x) {
          return x.name === alias;
        })
      )
        hits.unshift({ name: alias, group: 'also called ' + q.toUpperCase() });
      var exact = all.some(function (x) {
        return norm(x.name) === nq;
      });
      if (hits.length) {
        html += group(
          'm',
          'Matches',
          hits
            .map(function (x) {
              return opt(x.name, x.hh ? 'added by you' : x.group);
            })
            .join(''),
        );
        status = hits.length + (hits.length === 1 ? ' match' : ' matches');
      }
      if (!exact) {
        var near = all
          .filter(function (x) {
            return !x.hh;
          })
          .map(function (x) {
            return { x: x, d: lev(norm(x.name), nq) };
          })
          .filter(function (o) {
            return (
              o.d <= Math.max(3, Math.floor(nq.length / 4)) &&
              !hits.some(function (h) {
                return h.name === o.x.name;
              })
            );
          })
          .sort(function (a, b) {
            return a.d - b.d;
          })
          .slice(0, 2);
        var fixes = [];
        q.toLowerCase()
          .split(/\s+/)
          .forEach(function (w) {
            if (!w || WORDS.indexOf(w) !== -1) return;
            var best = WORDS.map(function (c) {
              return { c: c, d: lev(c, w) };
            }).sort(function (a, b) {
              return a.d - b.d;

            if (best && best.d > 0 && best.d <= 2) fixes.push([w, best.c]);
          });
        if (near.length || fixes.length) {
          var inner = near
            .map(function (o) {
              return opt(o.x.name, 'in the app');
            })
            .join('');
          var fixNote = '';
          if (fixes.length) {
            var fixed = q.toLowerCase();

            fixed = fixed.replace(/\b\w/g, function (c) {

            fixNote =
              '<p class="small" style="margin:4px 12px">Spelling: ' +
              fixes
                .map(function (f) {
                  return '<s>' + esc(f[0]) + '</s> → <strong>' + esc(f[1]) + '</strong>';

                .join(', ') +
              '</p>';
            inner += known
              ? opt(known.name, known.hh ? 'added by you' : 'in the app')
              : '<li><button type="button" class="opt" data-act="pick-new" data-name="' +
                esc(fixed) +
                '"><span>' +
                esc(fixed) +
                '</span><span class="tag">new · spelling fixed</span></button></li>';
          }
          html +=
            '<section aria-labelledby="g-dym" class="suggest"><h3 class="group-label" id="g-dym" style="margin:0">Did you mean</h3>' +
            fixNote +
            '<ul class="plain">' +
            inner +
            '</ul></section>';
          status =
            (status ? status + '. ' : '') +
            'Did you mean ' +
            (near[0]
              ? near[0].x.name
              : fixes
                  .map(function (f) {
                    return f[1];
                  })
                  .join(' ')) +
            '?';
        }
        if (!hits.length && !near.length && !fixes.length) status = 'No matches.';
        foot.hidden = false;
        // SUX-11: a name needs a letter, or an emoji becomes a permanent movement.

    // Close-and-open, never edit in place: HIST-1 reads the periods, so a change of days is a new period.
    // A period opened TODAY is replaced instead (FE-1): closing it would leave to < from.
    function applyAssign(aid, from, to, days) {
      var closed = [];
      function close(x) {
        if (!x) return;
        if (x.from === TODAY) {
          S.assignments = S.assignments.filter(function (y) {
            return y !== x;
          });
          closed.push({
            athlete: x.athlete,
            block: x.block,
            from: x.from,
            days: x.days,
            dropped: true,
          });
        } else {
          x.to = shift(TODAY, -1);
          closed.push(x);
        }
      }
      if (from) close(liveAssignment(aid, from));
      if (to !== from) close(liveAssignment(aid, to));
      S.assignments.push({ athlete: aid, block: to, from: TODAY, to: null, days: sortDays(days) });
      return { kind: 'assign', reopen: closed, drop: { athlete: aid, block: to } };
    }

    // ── measurement overlay ──────────────────────────────────────────────────
    function measure() {
      var on = $('#measure').checked;
      var app = $('#app');
      app.classList.toggle('measuring', on);
      app.querySelectorAll('.m-tag').forEach(function (t) {
        t.remove();
      });
      if (!on) return;
      app.querySelectorAll('[data-m]').forEach(function (el) {
        var w = el.getBoundingClientRect().width;
        var cs = getComputedStyle(el);
        var inner =
          w -
          parseFloat(cs.paddingLeft) -
          parseFloat(cs.paddingRight) -
          parseFloat(cs.borderLeftWidth) -
          parseFloat(cs.borderRightWidth);
        var tag = document.createElement('span');
        tag.className = 'm-tag';
        tag.setAttribute('aria-hidden', 'true');
        tag.textContent =
          Math.round(w) +
          (Math.round(inner) !== Math.round(w) ? ' / ' + Math.round(inner) + ' in' : '') +
          'px';
        if (cs.position === 'static') el.style.position = 'relative';
        el.appendChild(tag);
      });
    }

    // ── actions ──────────────────────────────────────────────────────────────
    function hideEvent(k, items) {
      var list = S.entries[k];
      items.forEach(function (e) {
        list.splice(list.indexOf(e), 1);
      });
      var ev = {
        id: 'h' + Date.now() + Math.random().toString(36).slice(2, 5),
        at: nowLabel(),
        hiddenOn: TODAY,
        items: items,
      };
      S.hidden[k] = (S.hidden[k] || []).concat([ev]);
      pageHidden[ev.id] = true;
      S.refusal = null;
      rerender('#undo-' + ev.id);
      announce(hiddenItemLabel(ev) + ' deleted. Undo is in its place, and in Hidden on this day.');
    }
    function restore(k, evId, swap) {
      var evs = S.hidden[k];
      var ev = evs.find(function (x) {
        return x.id === evId;
      });
      var live = S.entries[k] || (S.entries[k] = []);
      if (swap) {
        // One atomic act: hide the newer weigh-in, restore the older (trust panel T2).
        var held = live.find(function (x) {
          return x.slot === ev.items[0].slot;
        });
        live.splice(live.indexOf(held), 1);
        evs.push({ id: 'h' + Date.now(), at: nowLabel(), hiddenOn: TODAY, items: [held] });
      }
      var back = [];
      var refused = [];
      ev.items.forEach(function (e) {
        var held =
          e.slot &&
          live.find(function (x) {
            return x.slot === e.slot;
          });
        if (held) refused.push([e, held]);
        else back.push(e);
      });
      back.forEach(function (e) {
        live.push(e);
      });
      live.sort(function (a, b) {
        return a.order - b.order;
      });
      delete pageHidden[ev.id];
      if (refused.length) {
        ev.items = refused.map(function (p) {
          return p[0];
        });
        var f = refused[0];
        S.refusal = {
          ev: ev.id,
          swap: true,
          wanted: f[0].detail.split(' · ')[0],
          text:
            '<p style="margin:0">' +
            (back.length
              ? 'Restored ' + back.length + ' of ' + (back.length + refused.length) + '. '
              : '') +
            '<strong>' +
            esc(f[0].title) +
            ' ' +
            esc(f[0].detail.split(' · ')[0]) +
            '</strong> can’t come back while <strong>' +
            esc(f[1].detail.split(' · ')[0]) +
            '</strong> is logged for this day — one weigh-in per day.</p>',
        };
        rerender('#restore-' + ev.id);
        announce(
          (back.length ? 'Restored ' + back.length + '. ' : '') +
            'Could not restore ' +
            f[0].title +
            ': ' +
            f[1].detail.split(' · ')[0] +
            ' is logged for this day.',
        );
      } else {
        S.hidden[k] = evs.filter(function (x) {
          return x !== ev;
        });
        if (!S.hidden[k].length) delete S.hidden[k];
        S.refusal = null;
        rerender('#row-' + back[0].id);
        announce(
          'Restored ' +
            (back.length > 1 ? back.length + ' entries' : hiddenItemLabel({ items: back })) +
            '.',
        );
      }
    }

    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-go],[data-act]');
      if (!t) return;
      if (t.tagName === 'A') ev.preventDefault();
      if (t.disabled) return;
      var g = t.getAttribute('data-go');
      var r = S.route;
      if (g) {
        closeDialog(false);
        if (g === 'day') return go({ name: 'day', id: t.dataset.id || 'a1', day: TODAY });
        if (g === 'edit' || g === 'log' || g === 'history' || g === 'routine')
          return go({ name: g, id: t.dataset.id || 'a1' });
        if (g === 'del') return go({ name: 'del', id: t.dataset.id, step: 1 });
        if (g === 'program') {
          S.edit = null;
          return go(
            t.dataset.b
              ? { name: 'program', block: t.dataset.b }
              : { name: 'program', id: t.dataset.id || 'a1' },
          );
        }
        return go({ name: g });
      }
      var act = t.getAttribute('data-act');
      var k = r.id + '|' + r.day;
      switch (act) {
        case 'hide': {
          var e = S.entries[t.dataset.k].find(function (x) {
            return x.id === t.dataset.eid;
          });
          return hideEvent(t.dataset.k, [e]);
        }
        case 'log-act': {
          var le = {
            id: 'e' + Date.now(),
            order: 50,
            where: 'list',
            title: t.dataset.n,
            detail: 'Done',
          };
          (S.entries[t.dataset.k] = S.entries[t.dataset.k] || []).push(le);
          rerender('#row-' + le.id);
          return announce(t.dataset.n + ' saved.');
        }
        case 'hide-group':
          return hideEvent(
            t.dataset.k,
            S.entries[t.dataset.k].filter(function (x) {
              return x.group === t.dataset.group;
            }),
          );
        case 'restore':
          return restore(k, t.dataset.ev);
        case 'swap':
          return restore(k, t.dataset.ev, true);
        case 'leave': {
          var keepEv = S.refusal && S.refusal.ev;
          S.refusal = null;
          return rerender('#restore-' + keepEv);
        }
        case 'toggle-hidden':
          r.openHidden = !r.openHidden;
          return rerender('#hid-toggle');
        case 'day':
          r.day = shift(r.day, +t.dataset.n);
          r.openHidden = false;
          pageHidden = {};
          S.refusal = null;
          return rerender(
            $('[data-act="day"][data-n="' + t.dataset.n + '"]') &&
              shift(r.day, +t.dataset.n) <= TODAY
              ? '[data-act="day"][data-n="' + t.dataset.n + '"]'
              : '[data-act="day"][data-n="-1"]',
          );
        case 'goto-day':
          return go({ name: 'day', id: r.id || 'a1', day: t.dataset.d });
        case 'clear-open':
          return openClear();
        case 'dlg-close':
          return closeDialog();
        case 'leave-discard': {
          var dest = pendingGo;
          pendingGo = null;
          S.edit = null;
          S.programs = S.programs.filter(function (p) {
            return !p.fresh;
          });
          closeDialog(false);
          return go(dest);
        }
        case 'sel-prog':
          return go(Object.assign({}, r, { sel: t.dataset.b || null }));
        case 'assign-move':
          return openAssign(t.dataset.a, t.dataset.b, true);
        case 'open-picker':
          return openPicker();
        case 'pick':
        case 'pick-new':
          if (pickCtx) {
            var pc = pickCtx;
            var nrx = rx(t.dataset.name);
            nrx.created = act === 'pick-new';
            S.edit.blocks[pc.b][pc.day].push(nrx);
            S.edit.dirty = true;
            closeDialog(false);
            rerender('#s-' + nrx.id);
            return announce(
              t.dataset.name +
                (nrx.created ? ', a new movement,' : '') +
                ' added to ' +
                pc.day +
                '. Set its sets and reps.',
            );
          }
          S.form.movement = { name: t.dataset.name, created: act === 'pick-new' };
          closeDialog(false);
          rerender('#mv-btn');
          return announce('Movement: ' + t.dataset.name + (act === 'pick-new' ? ', new' : ''));
        case 'download':
          return announce('Prototype: the download would start here.');
        case 'archive-athlete': {
          var a = athlete(t.dataset.id);
          a.archived = true;
          var offs = [];
          S.assignments.forEach(function (x) {
            if (x.athlete === a.id && !x.to) {
              x.to = shift(TODAY, -1);
              offs.push(x);
            }
          });
          S.route = { name: 'settings' };
          S.flash =
            esc(a.name) +
            ' archived. Everything they logged is kept' +
            (offs.length ? ', and they are off their programs from today.' : '.');
          S.undo = { kind: 'athlete', id: a.id, reopen: offs };
          rerender('#undo-btn');
          return announce(a.name + ' archived.');
        }
        case 'unarchive':
          athlete(t.dataset.id).archived = false;
          S.flash = esc(athlete(t.dataset.id).name) + ' restored.';
          S.undo = null;
          rerender('#ath-' + t.dataset.id);
          return announce(athlete(t.dataset.id).name + ' restored.');
        case 'undo':
          return doUndo();
        case 'del-step':
          return go({ name: 'del', id: t.dataset.id, step: +t.dataset.step });
        case 'del-final': {
          var nm = athlete(t.dataset.id).name;
          S.athletes = S.athletes.filter(function (x) {
            return x.id !== t.dataset.id;
          });
          return go({ name: 'del', step: 4, deleted: nm });
        }
        case 'mv':
        case 'rm':
        case 'unrm': {
          var rows = S.edit.blocks[t.dataset.b][t.dataset.day];
          var i = +t.dataset.i;
          var p = rows[i];
          S.edit.dirty = true;
          if (act === 'rm') {
            p.removed = true;
            rerender('#unrm-' + p.id);
            return announce(p.name + ' will be removed when you save. Undo is in its place.');
          }
          if (act === 'unrm') {
            p.removed = false;
            rerender('#rx-' + p.id + ' [data-act="rm"]');
            return announce(p.name + ' kept.');
          }
          var j = i + +t.dataset.d;
          rows[i] = rows[j];
          rows[j] = p;
          var keep = (t.dataset.d === '-1' ? '#up-' : '#dn-') + p.id;
          rerender(keep);
          if (document.activeElement && document.activeElement.disabled !== false)
            focus((t.dataset.d === '-1' ? '#dn-' : '#up-') + p.id);
          return announce(p.name + ' moved to position ' + (j + 1) + ' of ' + rows.length + '.');
        }
        case 'add-rx':
          return openPicker({
            b: t.dataset.b,
            day: t.dataset.day,
            label: t.textContent.replace('+ Add a movement to ', ''),
          });
        case 'rm-day': {
          var rd = S.edit.blocks[t.dataset.b];
          var gone = workoutLabels(t.dataset.b)[+t.dataset.wi];
          delete rd[t.dataset.day];
          if (S.edit.labels) S.edit.labels.splice(+t.dataset.wi, 1);
          S.edit.dirty = true;
          rerender('[data-act="add-day"]');
          return announce(gone + ' removed.');
        }
        case 'add-day': {
          var ds = S.edit.blocks[t.dataset.b];

    function doUndo() {
      var u = S.undo;
      if (!u) return;
      if (u.kind === 'athlete') {
        athlete(u.id).archived = false;
        (u.reopen || []).forEach(function (x) {
          x.to = null;
        });
        S.flash =
          esc(athlete(u.id).name) +
          ' is back' +
          ((u.reopen || []).length ? ', on the same programs.' : '.');
      }
      if (u.kind === 'edit') {
        program(u.block).days = u.prev;
        S.edit = null;
        S.flash = 'Undone. ' + esc(program(u.block).name) + ' is as it was.';
      }
      if (u.kind === 'start') {
        S.programs = S.programs.filter(function (p) {
          return p.id !== u.block;
        });
        S.assignments = S.assignments.filter(function (y) {
          return y.block !== u.block;
        });
        S.flash = u.athlete
          ? 'Undone. ' + esc(athlete(u.athlete).name) + ' has no program.'
          : 'Undone.';
      }
      if (u.kind === 'archive' || u.kind === 'assign') {
        // ONE event: the archive and every assignment it closed come back together (a11y/interaction Q3).
        if (u.block) program(u.block).archived = false;
        if (u.drop)
          S.assignments = S.assignments.filter(function (y) {
            return !(
              y.athlete === u.drop.athlete &&
              y.block === u.drop.block &&
              y.from === TODAY &&
              !y.to
            );
          });
        u.reopen.forEach(function (x) {
          if (x.dropped) {
            S.assignments.push({
              athlete: x.athlete,
              block: x.block,
              from: x.from,
              to: null,
              days: x.days,
            });
            return;
          }
          var live = S.assignments.find(function (y) {
            return y.athlete === x.athlete && y.block === x.block && y.from === x.from;
          });
          if (live) live.to = null;
        });
        S.flash = u.keep
          ? 'Undone. ' +
            esc(athlete(u.drop.athlete).name) +
            ' is off it; ' +
            esc(program(u.keep).name) +
            ' is kept in Programs.'
          : 'Undone.';
      }
      if (u.kind === 'copy') {
        // SUX-2: newcomers come off the copy too, not only the athletes who moved from the original.
        u.moved.forEach(function (m) {
          S.assignments = S.assignments.filter(function (y) {
            return !(y.athlete === m.athlete && y.block === u.copy);
          });
          if (m.newcomer) return;
          var old = S.assignments.find(function (y) {
            return y.athlete === m.athlete && y.block === u.src && y.from === m.from;
          });
          if (old) old.to = null;
        });
        S.flash =
          'Undone. Everyone is back where they were; ' +
          esc(program(u.copy).name) +
          ' is kept, with nobody on it.';
      }
      S.undo = null;
      rerender('h1');
      announce($('.ok-msg span').textContent);
    }

              ' moved from ' +
              esc(program(from).name) +
              ' to ' +
              toName +
              ', ' +
              esc(onDays(v.days)) +
              '.';
        closeDialog(false);
        if (f.id === 'first-form') S.route = { name: 'day', id: aid, day: TODAY };
        rerender(S.route.confirmArchive ? '#archq-' + S.route.confirmArchive : '#undo-btn');
        return announce($('.ok-msg span').textContent);
      }
      if (f.id === 'rename-form') {
        var mv = S.householdMovements[+f.dataset.i];
        var nn = $('#rn-in').value.trim();
        if (nn) mv.name = nn;
        S.flash = 'Renamed to ' + esc(mv.name) + '.';
        rerender('#hm-' + f.dataset.i);
        return announce('Renamed to ' + mv.name + '.');
      }
    });

    // ── bar ──────────────────────────────────────────────────────────────────
    var sel = $('#screen-select');
    SCREENS.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s[0];
      o.textContent = s[1];
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      closeDialog(false);
      S.edit = null;
      go(screenToRoute(sel.value));
    });
    $('#width-select').addEventListener('change', function () {
      var w = $('#width-select').value;
      $('#device').style.width = w + 'px';
      $('#cap-w').textContent = w + 'px';
      measure();
    });
    $('#v-archive').addEventListener('change', function () {
      S.route.confirmArchive = null;
      render();
    });
    $('#v-rotation').addEventListener('change', function () {
      render();
      if ($('#assign-form')) drawAssignPreview($('#assign-form'));
    });
    $('#measure').addEventListener('change', measure);
    $('#reset').addEventListener('click', function () {
      S = fresh();
      pageHidden = {};
      save();
      render();
      announce('Prototype data reset.');
    });
    window.addEventListener('resize', measure);
    if (window.innerWidth <= 600) $('#bar-wrap').open = false;

    // Open the view named by a plain #anchor (artifact viewers pass only bare tokens).
    var start = (location.hash || '').replace('#', '');
    if (
      start &&
      SCREENS.some(function (s) {
        return s[0] === start;
      })
    )
      S.route = screenToRoute(start);
    render();
  })();
</script>
