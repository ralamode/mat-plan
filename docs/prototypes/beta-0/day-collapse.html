<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Day Collapse Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
/>
<style>
  /* Layout: a thin review bar, then the app at phone width on a quiet stage. Tokens mirror apps/web. */
  :root {
    --bg: oklch(1 0 0);
    --fg: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --primary: oklch(0.205 0 0);
    --primary-fg: oklch(0.985 0 0);
    --muted: oklch(0.965 0.003 250);
    --muted-fg: oklch(0.52 0.01 250);
    --border: oklch(0.915 0.004 250);
    --ring: oklch(0.6 0.12 250);
    --destructive: oklch(0.56 0.22 27);
    --done: oklch(0.6 0.15 150);
    --done-bg: oklch(0.96 0.04 150);
    --stage: oklch(0.955 0.005 250);
    --note: oklch(0.97 0.035 85);
    --note-fg: oklch(0.4 0.07 70);
    --chip: oklch(0.93 0.05 300);
    --chip-fg: oklch(0.42 0.14 300);
    --radius: 10px;
    --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: oklch(0.17 0.005 250);
      --fg: oklch(0.97 0 0);
      --card: oklch(0.21 0.006 250);
      --primary: oklch(0.93 0 0);
      --primary-fg: oklch(0.2 0 0);
      --muted: oklch(0.26 0.006 250);
      --muted-fg: oklch(0.72 0.01 250);
      --border: oklch(1 0 0 / 12%);
      --ring: oklch(0.7 0.12 250);
      --destructive: oklch(0.7 0.19 22);
      --done: oklch(0.75 0.15 150);
      --done-bg: oklch(0.3 0.05 150);
      --stage: oklch(0.12 0.004 250);
      --note: oklch(0.28 0.035 85);
      --note-fg: oklch(0.88 0.06 85);
      --chip: oklch(0.32 0.07 300);
      --chip-fg: oklch(0.86 0.08 300);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: oklch(0.17 0.005 250);
    --fg: oklch(0.97 0 0);
    --card: oklch(0.21 0.006 250);
    --primary: oklch(0.93 0 0);
    --primary-fg: oklch(0.2 0 0);
    --muted: oklch(0.26 0.006 250);
    --muted-fg: oklch(0.72 0.01 250);
    --border: oklch(1 0 0 / 12%);
    --ring: oklch(0.7 0.12 250);
    --destructive: oklch(0.7 0.19 22);
    --done: oklch(0.75 0.15 150);
    --done-bg: oklch(0.3 0.05 150);
    --stage: oklch(0.12 0.004 250);
    --note: oklch(0.28 0.035 85);
    --note-fg: oklch(0.88 0.06 85);
    --chip: oklch(0.32 0.07 300);
    --chip-fg: oklch(0.86 0.08 300);
    color-scheme: dark;
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  body {
    background: var(--stage);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--card);
  }
  button,
  input,
  select {
    font: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .review {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .review-in {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    font-size: 14px;
  }
  .review strong {
    font-weight: 600;
  }
  .review select {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    max-width: 100%;
  }
  .review label {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    color: var(--muted-fg);
  }
  .review .grow {
    flex: 1 1 auto;
  }
  .linkbtn {
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted-fg);
    text-decoration: underline;
    cursor: pointer;
    font-size: 14px;
  }

  .stage {
    padding-block: 20px 60px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .phone {
    max-width: 420px;
    margin: 0 auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    min-height: 640px;
    overflow: hidden;
  }
  .app {
    padding: 18px 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  h1 {
    font-size: 24px;
    line-height: 1.2;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  h2 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  p {
    margin: 0;
  }
  .hint {
    color: var(--muted-fg);
    font-size: 14px;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .between {
    justify-content: space-between;
  }
  .back {
    color: var(--muted-fg);
    font-size: 14px;
    text-decoration: none;
    background: none;
    border: 0;
    padding: 0;
    min-height: 44px;
    cursor: pointer;
    align-self: flex-start;
  }

  .btn {
    background: var(--primary);
    color: var(--primary-fg);
    border: 0;
    border-radius: 8px;
    padding: 9px 16px;
    font-weight: 500;
    cursor: pointer;
    min-height: 40px;
  }
  .btn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn.ghost {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
  }
  .btn.danger {
    background: var(--destructive);
    color: oklch(0.99 0 0);
  }
  .btn.wide {
    width: 100%;
  }
  .txt {
    background: none;
    border: 0;
    padding: 6px 4px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    color: var(--fg);
    min-height: 44px;
    min-width: 44px;
  }
  .txt.del {
    color: var(--destructive);
  }
  input[type='text'],
  input[type='number'],
  input[type='time'],
  select.field {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--bg);
    min-height: 40px;
    width: 100%;
  }
  input[type='number'] {
    font-variant-numeric: tabular-nums;
  }
  input.w-num {
    width: 96px;
    flex: 0 0 auto;
  }
  input.w-sm {
    width: 76px;
    flex: 0 0 auto;
  }

  .item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
  }
  .item .what {
    min-width: 0;
  }
  .item .val {
    font-variant-numeric: tabular-nums;
  }
  .item.logged {
    background: var(--done-bg);
    border-color: transparent;
  }
  .tick {
    display: inline-grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: var(--done);
    color: var(--bg);
    font-size: 13px;
    font-weight: 700;
    flex: 0 0 auto;
  }
  .tomb {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    color: var(--muted-fg);
    font-size: 14px;
  }
  .refusal {
    background: var(--note);
    color: var(--note-fg);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 14px;
  }
  .banner {
    background: var(--muted);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    font-size: 14px;
    flex-wrap: wrap;
  }
  .notice {
    background: var(--muted);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 14px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: pointer;
  }
  .check input {
    width: 20px;
    height: 20px;
    accent-color: var(--done);
  }
  .mv {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .mv-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .mv-head b {
    font-weight: 600;
  }
  .setrow {
    display: grid;
    grid-template-columns: 26px 1fr 1fr;
    gap: 8px;
    align-items: center;
  }
  .setrow span {
    color: var(--muted-fg);
    font-size: 13px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .sofar {
    font-size: 14px;
    color: var(--muted-fg);
    font-variant-numeric: tabular-nums;
  }

  .daynav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
  }
  .daynav button {
    width: 40px;
    height: 36px;
    border: 0;
    background: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
  }
  .daynav button[disabled] {
    opacity: 0.3;
    cursor: default;
  }
  .daynav span {
    font-weight: 500;
    font-size: 15px;
    text-align: center;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .tile {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: left;
    background: var(--card);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 96px;
  }
  .tile b {
    font-size: 17px;
    font-weight: 600;
  }
  .tile.add {
    border-style: dashed;
    color: var(--muted-fg);
    justify-content: center;
    align-items: center;
  }
  .menu {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .menu button {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: var(--card);
    border: 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
  }
  .menu button:last-child {
    border-bottom: 0;
  }

  .switch {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .switch .lbl {
    font-size: 15px;
    color: var(--muted-fg);
  }
  .switch .lbl.on {
    color: var(--fg);
    font-weight: 600;
  }
  .track {
    position: relative;
    width: 52px;
    height: 30px;
    border-radius: 999px;
    border: 0;
    background: var(--muted);
    cursor: pointer;
    padding: 0;
    flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .track::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--primary);
  }
  .track[aria-checked='true']::after {
    left: 25px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .track::after {
      transition: left 0.18s ease;
    }
  }
  .chip {
    display: none;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    background: var(--chip);
    color: var(--chip-fg);
    border-radius: 6px;
    padding: 1px 6px;
    letter-spacing: 0.02em;
  }
  .show-ids .chip {
    display: inline-block;
  }
  .sec {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* A read-only day shows its numbers as text, not as fields (maintainer, 2026-11-15). */
  input[readonly] {
    border-color: transparent;
    background: transparent;
    box-shadow: none;
  }
  .scrim {
    position: fixed;
    inset: 0;
    background: oklch(0 0 0 / 45%);
    display: grid;
    /* Top-anchored (maintainer, 2026-11-15): the phone keyboard never covers the buttons. */
    place-items: start center;
    z-index: 20;
    padding: 16px;
  }
  .dialog {
    background: var(--bg);
    border-radius: 14px;
    padding: 18px;
    max-width: 380px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .live {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  @media (prefers-reduced-motion: no-preference) {
    .item.logged {
      transition: background 0.25s;
    }
  }
  /* --- v6: FAM-1, the family program --- */
  .phone {
    position: relative;
  }
  textarea {
    font: inherit;
    color: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--bg);
    width: 100%;
    min-height: 64px;
    resize: vertical;
  }
  .review .ver {
    font-size: 13px;
  }
  .progline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .slotlbl {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-fg);
  }
  .wk {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .wk-h {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .wk-h h2 {
    font-size: 18px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-h {
    display: flex;
    gap: 8px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .card-h b {
    font-weight: 600;
  }
  .card-h .hint {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .card.all-done {
    border-color: transparent;
    background: var(--done-bg);
  }
  .letter {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--chip-fg);
    background: var(--chip);
    border-radius: 6px;
    padding: 0 6px;
  }
  .inst {
    font-size: 13px;
  }
  .ss {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-left: 3px solid var(--chip-fg);
    padding-left: 10px;
  }
  .ss-h {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--chip-fg);
  }
  .rest {
    font-size: 13px;
    color: var(--muted-fg);
  }
  .sg {
    display: grid;
    gap: 6px;
    align-items: center;
  }
  .sg .hd {
    font-size: 12px;
    color: var(--muted-fg);
    text-align: center;
  }
  .sg .n {
    font-size: 13px;
    color: var(--muted-fg);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .sg .pv {
    font-size: 13px;
    color: var(--muted-fg);
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .err {
    color: var(--destructive);
    font-size: 14px;
    margin: 2px 0 0;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    max-width: 340px;
    background: var(--fg);
    color: var(--bg);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
  }
  .sg input {
    min-height: 36px;
    padding: 6px 8px;
    text-align: center;
    width: 100%;
  }
  .sg .done-bg {
    grid-column: 1 / -1;
  }
  .ck {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: 1px solid var(--muted-fg);
    background: var(--muted);
    color: var(--muted-fg);
    font-weight: 700;
    cursor: pointer;
    font-size: 16px;
  }
  .ck[aria-pressed='true'] {
    background: var(--done);
    border-color: var(--done);
    color: var(--bg);
  }
  .sg .on {
    background: var(--done-bg);
    border-color: transparent;
  }
  .addset {
    align-self: flex-start;
  }
  .one {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .pastset {
    display: flex;
    gap: 10px;
    align-items: center;
    min-height: 32px;
  }
  .pastset .n {
    width: 20px;
    color: var(--muted-fg);
    font-variant-numeric: tabular-nums;
  }
  .card-h .grow,
  .pastset .grow {
    flex: 1 1 auto;
  }
  .item.edit {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .one .grow {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ed-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ed-f {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .ed-f label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 12px;
    color: var(--muted-fg);
  }
  .ed-f input {
    min-height: 36px;
    padding: 6px 8px;
    color: var(--fg);
    font-size: 15px;
  }
  .ed-tools {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    align-items: center;
  }
  .count {
    font-size: 12px;
    color: var(--muted-fg);
    text-align: right;
  }
  .savebar {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    margin: 0 -18px -28px;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .overlay {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(100%, 420px);
    background: var(--bg);
    z-index: 30;
    display: flex;
    flex-direction: column;
    border-inline: 1px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .ov-h {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .ov-b {
    flex: 1 1 auto;
    overflow: auto;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ov-f {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
  }
  .pick {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .pick[aria-checked='true'] {
    background: var(--done-bg);
    border-color: var(--done);
  }

    function ath(id) {

        return !e.hidden;

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });

    function chip(t) {

    // --- rendering helpers ---
    function tombOrRow(e, rowHtml) {
      if (e.hidden && e.event) return '';

        var ref =
          S.refusal === e.id
            ? '<div class="refusal" role="alert">Can’t restore this: ' +

          e.id +

    function plans(aid) {

    // ===================== FAM-1: the family program =====================
    function prog(id) {
      return S.programs.filter(function (p) {
        return p.id === id;
      })[0];
    }
    function wk(p, wid) {
      return p.workouts.filter(function (w) {
        return w.wid === wid;
      })[0];
    }
    function dow(day) {
      return d(day).getUTCDay();
    }
    var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
    function onProgram(aid, day) {
      var l = onPrograms(aid, day);
      return l.length ? l : null;
    }
    function itemName(it) {
      return (S.catalog[it.cat] || { name: it.cat }).name;
    }
    function itemType(it) {
      return (S.catalog[it.cat] || { type: 'check' }).type;
    }
    function nf(x) {
      return x == null || x === '' ? '' : String(x);
    }
    function presc(it) {
      var t = itemType(it);
      if (t === 'weight')
        return it.sets + ' × ' + it.reps + (it.load ? ' @ ' + it.load + ' lb' : '');
      if (t === 'reps') return it.sets + ' × ' + it.reps;
      if (t === 'timeset') return it.sets + ' × ' + it.sec + ' s';
      if (t === 'distance') return (it.sets > 1 ? it.sets + ' × ' : '') + it.dist + ' ' + it.unit;
      if (t === 'duration') return it.min + ' min';
      if (t === 'count') return it.n + ' ' + it.unit;
      return '';
    }
    function fieldsOf(it) {
      var t = itemType(it);
      if (t === 'weight')
        return [
          { f: 'load', hd: 'lb', p: it.load },
          { f: 'reps', hd: 'Reps', p: it.reps },
        ];
      if (t === 'reps') return [{ f: 'reps', hd: 'Reps', p: it.reps }];
      if (t === 'timeset') return [{ f: 'sec', hd: 'Sec', p: it.sec }];
      if (t === 'distance') return [{ f: 'dist', hd: it.unit, p: it.dist }];
      if (t === 'duration') return [{ f: 'min', hd: 'min', p: it.min }];
      if (t === 'count') return [{ f: 'n', hd: it.unit, p: it.n }];
      return [];
    }
    function fmt(it, v) {
      var t = itemType(it);
      if (t === 'weight') return v.load + ' lb × ' + v.reps;
      if (t === 'reps') return String(v.reps);
      if (t === 'timeset') return v.sec + ' s';
      if (t === 'distance') return v.dist + ' ' + it.unit;
      if (t === 'duration') return v.min + ' min';
      if (t === 'count') return v.n + ' ' + it.unit;
      return 'Done';
    }
    function rowsOf(day, slot, iid) {
      return S.entries.filter(function (e) {
        return (
          e.cat === 'row' && e.ath === S.ath && e.day === day && e.slot === slot && e.iid === iid
        );
      });
    }
    function rowEntry(day, slot, iid, set) {
      var es = rowsOf(day, slot, iid).filter(function (e) {
        return e.set === set && !(e.hidden && e.event);
      });
      return (
        es.filter(function (e) {
          return !e.hidden;
        })[0] ||
        es[es.length - 1] ||
        null
      );
    }
    // PREVIOUS: the same item and set number, the last time it was logged.
    function previous(iid, set, day) {
      var best = null;
      S.entries.forEach(function (e) {
        if (
          e.cat === 'row' &&
          e.ath === S.ath &&
          e.iid === iid &&
          e.set === set &&
          !e.hidden &&
          e.day < day &&
          (!best || e.day > best.day)
        )
          best = e;
      });
      return best;
    }
    function letters(items) {
      var map = {},
        out = [],
        next = 0,
        pos = {};
      items.forEach(function (it) {
        if (!it.ss) {
          out.push(null);
          return;
        }
        if (!(it.ss in map)) map[it.ss] = String.fromCharCode(65 + next++);
        pos[it.ss] = (pos[it.ss] || 0) + 1;
        out.push(map[it.ss] + pos[it.ss]);
      });
      return out;
    }
    function groupsOf(items) {
      // Consecutive runs: [{ ss, idx: [..] }]
      var out = [];
      items.forEach(function (it, i) {
        var last = out[out.length - 1];
        if (it.ss && last && last.ss === it.ss) last.idx.push(i);
        else out.push({ ss: it.ss, idx: [i] });
      });
      return out;
    }

    // --- Today: the day's workouts, logged per row (steps 11a–13b) ---

    // --- The workout editor: one screen, one Save (steps 8, 8b, 9) ---

    function normalize(items) {
      var seen = {},
        prev = null,
        n = 0;
      items.forEach(function (it) {
        if (it.ss && it.ss !== prev && seen[it.ss]) it.ss = it.ss + '_' + ++n;
        if (it.ss) seen[it.ss] = 1;
        prev = it.ss;
      });
      var count = {};
      items.forEach(function (it) {
        if (it.ss) count[it.ss] = (count[it.ss] || 0) + 1;
      });
      items.forEach(function (it) {
        if (it.ss && count[it.ss] < 2) it.ss = null;
      });
    }

        .map(function (a, i) {
          return (
            '<div class="item"><span>' +
            (i + 1) +
            '. ' +
            esc(prog(a.prog).name) +
            '</span><span class="row" style="flex-wrap:nowrap;gap:0">' +
            '<button class="txt" data-act="ord-move" data-i="' +
            i +
            '" data-dir="-1" aria-label="Move ' +
            esc(prog(a.prog).name) +
            ' up"' +
            (i ? '' : ' disabled') +
            '>↑</button>' +
            '<button class="txt" data-act="ord-move" data-i="' +
            i +
            '" data-dir="1" aria-label="Move ' +
            esc(prog(a.prog).name) +
            ' down"' +
            (i < cur.length - 1 ? '' : ' disabled') +
            '>↓</button></span></div>'
          );
        })
        .join('');
      document.getElementById('modal').innerHTML =
        '<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ord-t">' +
        '<h2 id="ord-t">' +
        esc(A.name) +
        '’s programs ' +
        chip('FAM-1 15c') +
        '</h2>' +
        '<p class="hint">The day page lists these programs’ workouts in this order. Inside a program, workouts follow the order set in its week. A program added later goes where it sits in the Programs list.</p>' +
        '<div class="stack" style="gap:6px">' +
        rows +
        '</div>' +
        '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">Done</button></div></div></div>';
      opened('[data-act=ord-move]:not([disabled])');
    }
    // A newly added program goes where it sits in the household's Programs list.
    function addPlan(aid, pid, from) {
      var l = plans(aid).slice(),
        rank = function (id) {
          return S.programs
            .map(function (x) {
              return x.id;
            })
            .indexOf(id);
        };
      var at = l.length;
      for (var i = 0; i < l.length; i++)
        if (current(l[i]) && rank(l[i].prog) > rank(pid)) {
          at = i;
          break;
        }
      l.splice(at, 0, { prog: pid, from: from });
      S.assign[aid] = l;
    }

    function render() {
      if (S.screen !== 'day') FOLD.visit = '';
      renderPage();
      if (FOLD.focus) {
        var target = document.getElementById(FOLD.focus);
        FOLD.focus = null;
        if (target) target.focus();
      }
    }
    function renderPage() {
      ensureState();
      var app = document.getElementById('app'),
        v;
      switch (S.screen) {
        case 'signin':
          v = vSignin();
          break;
        case 'welcome':
          v = vWelcome();
          break;
        case 'add':
          v = vAdd();
          break;
        case 'settings':
          v = vSettings();
          break;
        case 'privacy':
          v = vPrivacy();
          break;
        case 'programs':
          v = vPrograms();
          break;
        case 'program':
          v = S.prog && prog(S.prog) ? vProgram() : vPrograms();
          break;
        case 'workout':
          v = S.draft ? vWorkout() : vProgram();
          break;
        case 'day': {
          // One day page for every day, on a program or not (maintainer, 2026-11-15).
          v = vDayProgram(onPrograms(S.ath, S.day));
          break;
        }
        default:
          v = vPicker();
      }
      app.innerHTML = v;
      document.title = titleFor() + ' · Mat Plan';
      document.getElementById('ov').innerHTML =
        S.picker && S.screen === 'workout' ? vPicker2() : '';
      if (S.picker) {
        var q = document.getElementById('pk-q');
        if (q) {
          q.value = S.picker.q || '';
          filterPicker();
        }
      }
      save();
    }

    // --- actions ---
    function go(screen) {
      S.screen = screen;
      S.editing = null;
      S.weekAdd = null;
      S.picker = null;
      S.refusal = null;
      S.flash = null;
      render();
      window.scrollTo(0, 0);
      var h = document.querySelector('#app h1');
      if (h) {
        h.setAttribute('tabindex', '-1');
        h.focus({ preventScroll: true });
      }
    }
    function titleFor() {
      var A = ath(S.ath);
      if (S.screen === 'day' && A) return A.name + ' · ' + short(S.day);
      if (S.screen === 'program' && prog(S.prog)) return prog(S.prog).name + ' (program)';
      if (S.screen === 'workout' && S.draft) return S.draft.name + ' (workout)';
      return (
        {
          programs: 'Programs',
          settings: 'Family settings',
          privacy: 'Privacy notice',
          signin: 'Sign in',
          welcome: 'Welcome',
          add: 'Add an athlete',
        }[S.screen] || 'Home'
      );
    }
    function add(e) {
      e.id = 'e' + ++S.seq;
      S.entries.push(e);
      return e;
    }
    function val(id) {
      var el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }
    function slotTaken(e) {
      return S.entries.some(function (x) {
        if (x === e || x.hidden || x.ath !== e.ath || x.day !== e.day || x.cat !== e.cat)
          return false;
        if (e.cat === 'bw') return true;
        if (e.cat === 'strength') return x.mv === e.mv;
        if (e.cat === 'row') return x.slot === e.slot && x.iid === e.iid && x.set === e.set;
        if (FIELDS[e.key].type === 'count') return false;
        return x.key === e.key;
      });
    }

    document.addEventListener('click', function (ev) {
      var t = ev.target.closest('[data-act],[data-go]');
      if (!t) return;
      if (t.dataset.go) return go(t.dataset.go);
      var a = t.dataset.act,
        id = t.dataset.id;
      var e =
        id &&
        S.entries.filter(function (x) {
          return x.id === id;
        })[0];
      S.flash = null;
      S.err = null;
      var nextFocus = null;
      switch (a) {
        case 'signin':
          S.signedIn = true;
          go(S.family === 'new' && !S.athletes.length ? 'welcome' : 'picker');
          return;
        case 'signout':
          S.signedIn = false;
          go('signin');
          return;
        case 'open':
          S.ath = id;
          S.day = TODAY;
          go('day');
          return;
        case 'prev':
          S.day = addDays(S.day, -1);
          S.editing = null;
          S.refusal = null;
          break;
        case 'next':
          if (S.day < TODAY || onProgram(S.ath, addDays(S.day, 1))) S.day = addDays(S.day, 1);
          S.editing = null;
          S.refusal = null;
          break;
        case 'first-athlete':
        case 'add-athlete': {
          var ks = document.getElementById('new-kind');
          var nm = val('new-name') || 'New athlete',
            kind = ks && ks.getAttribute('aria-checked') === 'true' ? 'Adult' : 'Child';
          var isNew = S.family === 'new';
          var na = {
            id: 'a' + ++S.seq,
            name: nm,
            kind: kind,
            archived: false,
            program: null,
            checkins: [],
            life: [],
            strength: true,
          };
          S.athletes.push(na);
          S.ath = na.id;
          S.day = TODAY;
          say(nm + ' added');
          go('day');
          return;
        }
        case 'kind': {
          var on = t.getAttribute('aria-checked') !== 'true';
          t.setAttribute('aria-checked', on ? 'true' : 'false');
          document.getElementById('kind-adult').classList.toggle('on', on);
          document.getElementById('kind-child').classList.toggle('on', !on);
          return;
        }
        case 'edit-name':
          S.editing = 'name-' + id;
          break;
        case 'rename':
          ath(id).name = val('rename') || ath(id).name;
          S.editing = null;
          say('Renamed');
          break;
        case 'archive':
          ath(id).archived = true;
          say('Archived');
          break;
        case 'unarchive':
          ath(id).archived = false;
          say('Restored');
          break;
        case 'edit':
          S.editing = id;
          nextFocus = '#bw-edit, #min-edit';
          break;
        case 'cancel':
          nextFocus = '[data-act=edit][data-id="' + S.editing + '"]';
          S.editing = null;
          break;
        case 'bw-log': {
          var v = bwOk(val('bw-in'));
          if (v == null) break;
          delete S.pending['bw-in'];
          add({ ath: S.ath, day: S.day, cat: 'bw', value: v, at: nowTime() });
          say('Bodyweight logged');
          break;
        }
        case 'bw-save': {
          if (val('bw-edit') === '') {
            e.hidden = true;
            e.event = null;
            S.editing = null;
            nextFocus = '#bw-in';
            say('Bodyweight cleared');
            break;
          }
          var v2 = bwOk(val('bw-edit'));
          if (v2 == null) break;
          e.value = v2;
          nextFocus = '[data-act=edit][data-id="' + e.id + '"]';
          S.editing = null;
          say('Bodyweight changed to ' + v2.toFixed(1) + ' lb');
          break;
        }
        case 'min-log': {
          var k2 = t.dataset.key,
            m = minOk(val('min-' + k2), 'min-' + k2);
          if (m == null) break;
          delete S.pending['min-' + k2];
          add({ ath: S.ath, day: S.day, cat: 'life', key: k2, value: m });
          say(FIELDS[k2].label + ' logged');
          break;
        }
        case 'min-save': {
          if (val('min-edit') === '') {
            e.hidden = true;
            e.event = null;
            S.editing = null;
            nextFocus = '#min-' + e.key;
            say(FIELDS[e.key].label + ' cleared');
            break;
          }
          var m3 = minOk(val('min-edit'), 'min-edit');
          if (m3 == null) break;
          e.value = m3;
          S.editing = null;
          say(FIELDS[e.key].label + ' changed to ' + m3 + ' min');
          nextFocus = '[data-act=edit][data-id="' + e.id + '"]';
          break;
        }
        case 'del':
          nextFocus = '[data-act=undo][data-id="' + id + '"]';
          e.hidden = true;
          e.event = null;
          S.refusal = null;
          say(label(e) + ' deleted. Undo is in its place.');
          break;
        case 'undo':
          if (slotTaken(e)) {
            S.refusal = e.id;
            say('Can’t restore: a newer entry is logged');
            break;
          }
          e.hidden = false;
          S.refusal = null;
          nextFocus = '[data-act=del][data-id="' + id + '"]';
          say(label(e) + ' restored');
          break;
        case 'clear':
          return openClear();
        case 'restore-day': {
          var evId = +t.dataset.ev,
            blocked = 0;
          S.entries.forEach(function (x) {
            if (x.event === evId) {
              if (slotTaken(x)) {
                blocked++;
              } else {
                x.hidden = false;
                x.event = null;
              }
            }
          });
          S.entries.forEach(function (x) {
            if (x.event === evId) x.event = null;
          });
          S.flash = blocked
            ? 'Restored. ' +
              blocked +
              ' entr' +
              (blocked > 1 ? 'ies were' : 'y was') +
              ' logged again since, so ' +
              (blocked > 1 ? 'they stay' : 'it stays') +
              ' deleted.'
            : null;
          say('Day restored');
          break;
        }
        case 'clear-confirm': {
          var evn = ++S.ev,
            cnt = 0;
          live(dayEntries(S.ath, S.day)).forEach(function (x) {
            x.hidden = true;
            x.event = evn;
            cnt++;
          });
          closeModal(true);
          window.scrollTo(0, 0);
          nextFocus = '[data-act=restore-day]';
          say('Day cleared. Restore all is at the top.');
          break;
        }
        // --- FAM-1 ---
        case 'choose-prog':
          return go('programs');
        case 'order':
          return openOrder();
        case 'ord-move': {
          var cl = plans(S.ath).filter(current),
            oi = +t.dataset.i,
            oj = oi + +t.dataset.dir,
            rest = plans(S.ath).filter(function (x) {
              return !current(x);
            });
          var tmp0 = cl[oi];
          cl[oi] = cl[oj];
          cl[oj] = tmp0;
          S.assign[S.ath] = cl.concat(rest);
          var keepOpener = OPENER;
          render();
          OPENER = keepOpener;
          openOrder();
          say(prog(tmp0.prog).name + ' moved to ' + (oj + 1));
          var fb =
            document.querySelector(
              '[data-act=ord-move][data-i="' +
                oj +
                '"][data-dir="' +
                t.dataset.dir +
                '"]:not([disabled])',
            ) || document.querySelector('[data-act=ord-move]:not([disabled])');
          if (fb) fb.focus();
          return;
        }
        case 'takeoff': {
          var ta = asgOf(t.dataset.aid, S.prog),
            tn = ath(t.dataset.aid).name,
            tp = prog(S.prog).name;
          if (ta.from > TODAY)
            S.assign[t.dataset.aid] = plans(t.dataset.aid).filter(function (x) {
              return x !== ta;
            });
          else ta.to = addDays(TODAY, 1);
          S.flash =
            tn + ' comes off ' + tp + ' after today. Days already logged keep what they had.';
          say(S.flash);
          break;
        }
        case 'copy-wk':
          return openCopy(t.dataset.wid);
        case 'copy-go': {
          var sp = prog(S.prog),
            sw = wk(sp, t.dataset.wid),
            tp2 = prog(document.getElementById('cp-to').value);
          var cw = JSON.parse(JSON.stringify(sw));
          cw.wid = 'w' + ++S.seq;
          cw.from = { prog: sp.name, on: TODAY };
          // The name stays within 30 characters; the provenance is always the program's name, frozen.
          if (tp2.id === sp.id) cw.name = sw.name.slice(0, 23) + ' (copy)';
          tp2.workouts.push(cw);
          var lb = val('cp-label'),
            ds = [];
          Array.prototype.forEach.call(
            document.querySelectorAll('input[name=cp-day]:checked'),
            function (b) {
              (tp2.week[+b.value] = tp2.week[+b.value] || []).push({ label: lb, wid: cw.wid });
              ds.push(DAYS[+b.value].slice(0, 3));
            },
          );
          closeModal();
          S.prog = tp2.id;
          go('program');
          S.flash =
            sw.name +
            ' copied to ' +
            tp2.name +
            (ds.length ? ', on ' + andList(ds) : '') +
            '. Editing one won’t change the other.';
          render();
          say(S.flash);
          return;
        }
        case 'new-prog':
          newProgram();
          window.scrollTo(0, 0);
          nextFocus = '#pname';
          break;
        case 'fold-open':
          FOLD.open[t.dataset.key] = true;
          FOLD.focus = 'unfold-' + t.id.replace('fold-', '');
          say('Opened');
          break;
        case 'fold-close':
          delete FOLD.open[t.dataset.key];
          delete FOLD.seenOpen[t.dataset.key];
          FOLD.focus = 'fold-' + t.id.replace('unfold-', '');
          say('Collapsed');
          break;
        case 'open-prog':
          S.prog = t.dataset.pid;
          return go('program');
        case 'pname':
          S.editing = 'pname';
          break;
        case 'pname-save':
          if (!val('pname')) {
            S.flash = 'Give the program a name, then Save.';
            nextFocus = '#pname';
            break;
          }
          prog(S.prog).name = val('pname');
          delete prog(S.prog).fresh;
          S.editing = null;
          say('Program renamed');
          break;
        case 'start':
          return openStart();
        case 'start-go': {
          var from = document.getElementById('st-from').value,
            names = [];
          Array.prototype.forEach.call(
            document.querySelectorAll('input[name=st-ath]:checked:not(:disabled)'),
            function (b) {
              addPlan(b.value, S.prog, from);
              names.push(ath(b.value).name);
            },
          );
          closeModal();
          if (!names.length) break;
          S.flash =
            names.join(' and ') +
            ' start' +
            (names.length > 1 ? '' : 's') +
            ' ' +
            prog(S.prog).name +
            ' on ' +
            short(from) +
            '.';
          say(S.flash);
          break;
        }
        case 'edit-wk':
          S.draft = JSON.parse(JSON.stringify(wk(prog(S.prog), t.dataset.wid)));
          return go('workout');
        case 'new-wk':
          S.draft = {
            wid: 'w' + ++S.seq,
            name: '',
            desc: '',
            rests: {},
            items: [],
            isNew: true,
          };
          go('workout');
          document.querySelector('[data-d=name]').focus();
          return;
        case 'wk-cancel':
          S.draft = null;
          S.picker = null;
          return go('program');
        case 'wk-save': {
          var p = prog(S.prog),
            dr = S.draft,
            isNew = dr.isNew;
          if (!String(dr.name).trim()) {
            S.flash = 'Give the workout a name, then Save.';
            nextFocus = '[data-d=name]';
            break;
          }
          normalize(dr.items);
          delete dr.isNew;
          dr.items.forEach(function (it) {
            ['sets', 'reps', 'load', 'sec', 'dist', 'min', 'n'].forEach(function (f) {
              if (it[f] !== undefined && it[f] !== '' && !isNaN(+it[f])) it[f] = +it[f];
            });
          });
          if (isNew) p.workouts.push(dr);
          else
            p.workouts = p.workouts.map(function (w) {
              return w.wid === dr.wid ? dr : w;
            });
          S.draft = null;
          say('Workout saved. Rows already logged keep what they were logged against.');
          return go('program');
        }
        case 'it-move': {
          var its = S.draft.items,
            i = +t.dataset.i,
            j = i + +t.dataset.dir,
            tmp = its[i];
          its[i] = its[j];
          its[j] = tmp;
          normalize(its);
          say(itemName(tmp) + ' moved');
          break;
        }
        case 'it-del': {
          var gone = S.draft.items.splice(+t.dataset.i, 1)[0];
          normalize(S.draft.items);
          say(itemName(gone) + ' removed. Cancel to undo.');
          break;
        }
        case 'ss-link': {
          var its2 = S.draft.items,
            k = +t.dataset.i,
            g = its2[k].ss || its2[k + 1].ss || 'g' + ++S.seq,
            old = its2[k + 1].ss;
          its2.forEach(function (x) {
            if (old && x.ss === old) x.ss = g;
          });
          its2[k].ss = g;
          its2[k + 1].ss = g;
          normalize(its2);
          say('Superset made');
          break;
        }
        case 'ss-unlink': {
          var its3 = S.draft.items,
            m = +t.dataset.i,
            g2 = its3[m].ss,
            ng = 'g' + ++S.seq;
          for (var q = m + 1; q < its3.length && its3[q].ss === g2; q++) its3[q].ss = ng;
          normalize(its3);
          say('Unlinked');
          break;
        }
        case 'pick-open':
          S.picker = { sel: {}, newOpen: false, q: '' };
          window.scrollTo(0, 0);
          nextFocus = '#pk-q';
          break;
        case 'pick-close':
          S.picker = null;
          nextFocus = '[data-act=pick-open]';
          break;
        case 'pick': {
          var pk = t.dataset.k;
          if (S.picker.sel[pk]) delete S.picker.sel[pk];
          else S.picker.sel[pk] = Date.now() + Math.random();
          break;
        }
        case 'ni-open':
          S.picker.newOpen = true;
          break;
        case 'ni-cancel':
          S.picker.newOpen = false;
          break;
        case 'ni-save': {
          var nm2 = val('ni-name');
          if (!nm2) return;
          var nk = 'c' + ++S.seq;
          S.catalog[nk] = { name: nm2, type: document.getElementById('ni-type').value };
          S.picker.sel[nk] = Date.now();
          S.picker.newOpen = false;
          say(nm2 + ' created and selected');
          break;
        }
        case 'pick-add': {
          var sel = S.picker.sel,
            ks = Object.keys(sel).sort(function (a, b) {
              return sel[a] - sel[b];
            });
          ks.forEach(function (ck) {
            var it = mk(ck, defaults(S.catalog[ck].type));
            if (
              S.draft.items.some(function (x) {
                return x.iid === it.iid;
              })
            )
              it.iid = ck + '_' + ++S.seq;
            S.draft.items.push(it);
          });
          S.picker = null;
          say(ks.length + ' item' + (ks.length > 1 ? 's' : '') + ' added');
          break;
        }
        case 'wadd':
          S.weekAdd = +t.dataset.day;
          break;
        case 'wadd-cancel':
          S.weekAdd = null;
          break;
        case 'wadd-save': {
          var pp = prog(S.prog),
            wid3 = document.getElementById('wa-wid').value,
            added = [],
            skipped = [];
          Array.prototype.forEach.call(
            document.querySelectorAll('input[name=wa-day]:checked'),
            function (b) {
              var dk = +b.value;
              if (
                freeOn(pp, dk).some(function (w) {
                  return w.wid === wid3;
                })
              ) {
                (pp.week[dk] = pp.week[dk] || []).push({
                  label: val('wa-label'),
                  wid: wid3,
                });
                added.push(DAYS[dk].slice(0, 3));
              } else skipped.push(DAYS[dk].slice(0, 3));
            },
          );
          if (!added.length && !skipped.length) {
            S.flash = 'Pick at least one day.';
            break;
          }
          S.weekAdd = null;
          S.flash =
            (added.length ? wk(pp, wid3).name + ' added on ' + andList(added) + '.' : '') +
            (skipped.length ? ' Already on ' + andList(skipped) + ', so skipped.' : '');
          say(S.flash);
          break;
        }
        case 'wmove': {
          var wl = prog(S.prog).week[+t.dataset.day],
            wi = +t.dataset.i,
            wj = wi + +t.dataset.dir,
            wt = wl[wi];
          wl[wi] = wl[wj];
          wl[wj] = wt;
          say('Moved');
          break;
        }
        case 'wdel': {
          prog(S.prog).week[+t.dataset.day].splice(+t.dataset.i, 1);
          say('Removed from ' + DAYS[+t.dataset.day]);
          break;
        }
        case 'addset': {
          var xk = S.day + '|' + t.dataset.slot + '|' + t.dataset.iid;
          S.extra[xk] = (S.extra[xk] || 0) + 1;
          say('Set added');
          break;
        }
        case 'row': {
          var slot = t.dataset.slot,
            pid2 = slot.split('_')[0],
            P2 = prog(pid2),
            W = wk(P2, slot.slice(pid2.length + 1));
          var it2 = W.items.filter(function (x) {
              return x.iid === t.dataset.iid;
            })[0],
            set = +t.dataset.set;
          var ex = rowEntry(S.day, slot, it2.iid, set),
            lbl2 = itemName(it2) + (SET_TYPES[itemType(it2)] ? ' set ' + set : '');
          if (ex && !ex.hidden) {
            ex.hidden = true;
            ex.event = null;
            say(lbl2 + ' un-checked');
            break;
          }
          var v = {},
            missing = false,
            bad = false,
            rid = 'r-' + slot + '-' + it2.iid + '-' + set;
          fieldsOf(it2).forEach(function (f) {
            var typed = val(rid + '-' + f.f);
            if (typed !== '' && isNaN(+typed)) bad = true;
            v[f.f] = typed !== '' ? +typed : f.p;
            if (v[f.f] == null || v[f.f] === '') missing = true;
          });
          if (bad || missing) {
            S.err = { at: rid, msg: bad ? 'Numbers only.' : 'Enter a number, then ✓.' };
            break;
          }
          if (S.failNext) {
            // A ✓ that fails (plan D24): the row un-ticks, keeps what was typed, and says so.
            S.failNext = false;
            fieldsOf(it2).forEach(function (f) {
              S.pending[rid + '-' + f.f] = String(v[f.f]);
            });
            S.err = { at: rid, msg: 'Couldn’t save. Try again.' };
            break;
          }
          fieldsOf(it2).forEach(function (f) {
            delete S.pending[rid + '-' + f.f];
          });
          if (ex) {
            ex.hidden = false;
            ex.v = v;
          } else
            stamp(
              add({
                ath: S.ath,
                day: S.day,
                cat: 'row',
                slot: slot,
                wid: W.wid,
                iid: it2.iid,
                set: set,
                v: v,
                at: nowTime(),
              }),
            );
          say(lbl2 + ' logged');
          break;
        }
        case 'row-old':
          // A row whose item has left the workout: it can be un-ticked and ticked back, nothing more.
          e.hidden = !e.hidden;
          e.event = null;
          say(e.nm + (e.hidden ? ' un-checked' : ' logged'));
          break;
        case 'modal-close':
          closeModal();
          return;
      }
      render();
      // Focus stays where the person was: the same control, or the one the action names; a refusal
      // focuses its field (accessibility panel, d3 round 1).
      var to =
        document.querySelector('[aria-invalid="true"]') ||
        (nextFocus && document.querySelector(nextFocus)) ||
        document.querySelector(selectorOf(t));
      if (to) to.focus();
    });
    function selectorOf(t) {
      return (
        '[data-act="' +
        t.dataset.act +
        '"]' +
        ['id', 'slot', 'iid', 'set', 'key', 'day', 'i', 'dir', 'wid', 'aid', 'pid']
          .map(function (k) {
            return t.dataset[k] != null ? '[data-' + k + '="' + t.dataset[k] + '"]' : '';
          })
          .join('')
      );
    }

    function openClear() {
      OPENER = document.activeElement;
      var A = ath(S.ath),
        n = live(dayEntries(S.ath, S.day)).length;
      document.getElementById('modal').innerHTML =
        '<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="clr-t" aria-describedby="clr-d">' +
        '<h2 id="clr-t">Clear ' +
        esc(dayLabel(S.day).replace(/^Today · |^Yesterday · /, '')) +
        '? ' +
        chip('V1-9b B2') +
        '</h2>' +
        '<p id="clr-d" class="hint">This hides everything ' +
        esc(A.name) +
        ' logged that day: ' +
        esc(clearSummary(S.ath, S.day)) +
        '. You can restore it all at once.' +
        // PRIV-3 requirement 2 (maintainer, 2026-11-15): say the note outlives the clear.
        (hasEarlier(S.ath, S.day)
          ? ' A strength session’s “How did it feel?” note is kept, though the day page doesn’t show it.'
          : '') +
        '</p>' +
        '<label class="stack" style="gap:4px"><span>Type <b>delete</b> to confirm</span><input type="text" id="clr-in" autocomplete="off" autocapitalize="none"></label>' +
        '<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="modal-close">Cancel</button><button class="btn danger" id="clr-go" data-act="clear-confirm" disabled>Clear day</button></div></div></div>';
      var inp = document.getElementById('clr-in');
      inp.focus();
      inp.addEventListener('input', function () {
        document.getElementById('clr-go').disabled = inp.value.trim().toLowerCase() !== 'delete';
      });
    }
    function hasEarlier(aid, day) {
      return live(dayEntries(aid, day)).some(function (e) {
        return e.cat !== 'row' && e.cat !== 'bw' && e.cat !== 'life';
      });
    }
    function clearSummary(aid, day) {
      var es = live(dayEntries(aid, day)),
        parts = [],
        wks = {},
        sets = 0,
        other = 0;
      es.forEach(function (e) {
        if (e.cat === 'row') {
          sets++;
          wks[e.wn || 'a workout'] = 1;
        } else if (e.cat === 'bw') parts.push('bodyweight');
        else if (e.cat === 'life') parts.push(FIELDS[e.key].label.toLowerCase());
        else other++;
      });
      var wn = Object.keys(wks);
      if (wn.length)
        parts.unshift(
          andList(wn) + ' (' + sets + (sets > 1 ? ' sets and checks' : ' set or check') + ')',
        );
      if (other) parts.push(other + ' earlier entr' + (other > 1 ? 'ies' : 'y'));
      return andList(parts);
    }
    var OPENER = null;
    function opened(first) {
      var m = document.getElementById('modal'),
        el =
          m.querySelector(first) ||
          m.querySelector('button:not([disabled]), input:not([disabled]), select');
      if (el) el.focus();
    }
    function closeModal(keepFocus) {
      document.getElementById('modal').innerHTML = '';
      var o = OPENER;
      OPENER = null;
      if (keepFocus) return;
      if (o && document.contains(o)) o.focus();
      else {
        var h = document.querySelector('#app h1');
        if (h) h.focus();
      }
    }
    document.addEventListener('keydown', function (ev) {
      var m = document.getElementById('modal');
      if (!m.innerHTML) return;
      if (ev.key === 'Escape') return closeModal();
      if (ev.key !== 'Tab') return;
      // Keep Tab inside the dialog.
      var f = Array.prototype.filter.call(
        m.querySelectorAll('button, input, select, textarea'),
        function (x) {
          return !x.disabled;
        },
      );
      if (!f.length) return;
      if (ev.shiftKey && document.activeElement === f[0]) {
        ev.preventDefault();
        f[f.length - 1].focus();
      } else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) {
        ev.preventDefault();
        f[0].focus();
      }
    });

    function newProgram() {
      var id = 'p' + ++S.seq;
      S.programs.push({
        id: id,
        fresh: true,
        name: 'New program',
        workouts: [],
        week: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] },
      });
      S.prog = id;
      S.editing = 'pname';
      S.screen = 'program';
    }
    // Typing in the editor updates the draft without redrawing, so focus stays put.
    document.addEventListener('input', function (ev) {
      var el = ev.target;
      if (el.id === 'pk-q') {
        S.picker.q = el.value;
        filterPicker();
        return;
      }
      if (el.dataset && el.dataset.pend) {
        S.pending[el.id] = el.value;
        save();
        return;
      }
      var path = el.dataset && el.dataset.d;
      if (!path || !S.draft) return;
      var parts = path.split('.');
      if (parts.length === 1) {
        S.draft[parts[0]] = el.value;
        if (parts[0] === 'name')
          document.getElementById('cnt-name').textContent = el.value.length + ' / 30';
      } else if (parts[0] === 'rest') S.draft.rests[parts[1]] = el.value;
      else {
        S.draft.items[+parts[0]][parts[1]] = el.value;
        if (parts[1] === 'note') {
          var c = document.getElementById('cnt-' + parts[0]);
          if (c) c.textContent = el.value.length + ' / 500';
        }
      }
      save();
    });
    // Changing a number on a logged row changes the entry (the V1-24 2b question: is this the amend?).
    document.addEventListener('change', function (ev) {
      var el = ev.target,
        id = el.dataset && el.dataset.row;
      if (!id) return;
      var e = S.entries.filter(function (x) {
        return x.id === id;
      })[0];
      if (!e) return;
      var v = el.value.trim(),
        old = e.v[el.dataset.f];
      if (v === '' || isNaN(+v)) {
        el.value = nf(old);
        say('Kept ' + old + ': enter a number to change it.');
        return;
      }
      e.v[el.dataset.f] = +v;
      save();
      say(label(e) + ' changed to ' + v);
    });
    function filterPicker() {
      var q = ((S.picker && S.picker.q) || '').toLowerCase();
      var shown = 0;
      Array.prototype.forEach.call(document.querySelectorAll('#pk-list .pick'), function (b) {
        b.hidden = q && b.dataset.name.indexOf(q) < 0;
        if (!b.hidden) shown++;
      });
      var none = document.getElementById('pk-none');
      if (none) none.hidden = shown > 0;
    }

    // --- review bar ---
    // A new family has nothing; your sample family is set aside and comes back on any other jump.
    function useNewFamily() {
      if (S.family === 'new') return;
      S.stash = {
        athletes: S.athletes,
        entries: S.entries,
        programs: S.programs,
        assign: S.assign,
      };
      S.athletes = [];
      S.entries = [];
      S.programs = [];
      S.assign = {};
      S.family = 'new';
    }
    function useExistingFamily() {
      if (S.family !== 'new') return;
      var f = S.stash || seed();
      S.athletes = f.athletes;
      S.entries = f.entries;
      S.programs = f.programs;
      S.assign = f.assign;
      S.stash = null;
      S.family = 'existing';
    }
    function dayOf(a, day) {
      S.ath = a;
      S.day = day;
      S.screen = 'day';
      S.signedIn = true;
    }
    function jump(v) {
      // Stamp seeded rows before any state changes the program (a URL like #edited jumps before the
      // first render, and "edited" rewrites the program the stamps are taken from).
      ensureState();
      S.editing = null;
      S.refusal = null;
      S.flash = null;
      S.picker = null;
      S.weekAdd = null;
      S.draft = null;
      TODAY = REAL_TODAY;
      S.today = null;
      if (v === 'welcome') {
        useNewFamily();
        S.signedIn = true;
        S.screen = 'welcome';
        render();
        window.scrollTo(0, 0);
        return;
      }
      useExistingFamily();
      S.signedIn = true;
      if (v === 'signin') {
        S.signedIn = false;
        S.screen = 'signin';
      } else if (v === 'picker') S.screen = 'picker';
      else if (v === 'folded' || v === 'foldedall') {
        dayOf('a1', TODAY);
        FOLD.visit = '';
        daySlots(onPrograms('a1', TODAY), TODAY).forEach(function (x, i) {
          if (v === 'foldedall' || i === 0) finishWorkout(TODAY, x.key);
        });
        if (v === 'foldedall') {
          // Bodyweight and practice logged too, so the second option has something to fold.
          var mine = dayEntries('a1', TODAY);
          if (
            !live(mine).some(function (e) {
              return e.cat === 'bw';
            })
          )
            add({ ath: 'a1', day: TODAY, cat: 'bw', value: 112.4, at: nowTime() });
          if (
            !live(mine).some(function (e) {
              return e.cat === 'life' && e.key === 'wrestling_practice';
            })
          )
            add({
              ath: 'a1',
              day: TODAY,
              cat: 'life',
              key: 'wrestling_practice',
              value: 90,
              at: nowTime(),
            });
        }
      } else if (v === 'today') dayOf('a1', TODAY);
      else if (v === 'yesterday') dayOf('a1', addDays(TODAY, -1));
      else if (v === 'closed') dayOf('a1', '2026-11-11');
      else if (v === 'tomorrow') dayOf('a1', '2026-11-16');
      else if (v === 'sunday') {
        TODAY = S.today = '2026-11-15';
        dayOf('a1', TODAY);
      } else if (v === 'clear') dayOf('a1', addDays(TODAY, -1));
      else if (v === 'edited') {
        // The program is edited AFTER yesterday was logged: fewer sets and a heavier bench, pull-ups
        // removed from Heavy A, push-ups cut to two sets. Logged rows keep what they were logged against.
        var hw = wk(prog('p1'), 'w2'),
          mh = wk(prog('p1'), 'w1');
        hw.items = hw.items.filter(function (x) {
          return x.iid !== 'pullup';
        });
        normalize(hw.items);
        hw.items.forEach(function (x) {
          if (x.iid === 'dbbench') {
            x.sets = 3;
            x.load = 30;
          }
        });
        mh.items.forEach(function (x) {
          if (x.iid === 'pushups') x.sets = 2;
        });
        dayOf('a1', addDays(TODAY, -1));
      } else if (v === 'failed') {
        dayOf('a1', TODAY);
        S.failNext = true;
        S.pending['r-p1_w1-neck-1-sec'] = '30';
        S.err = { at: 'r-p1_w1-neck-1', msg: 'Couldn’t save. Try again.' };
      } else if (v === 'nomatch') {
        S.prog = 'p1';
        S.draft = JSON.parse(JSON.stringify(wk(prog('p1'), 'w2')));
        S.screen = 'workout';
        S.picker = { sel: {}, newOpen: false, q: 'kettlebell snatch' };
      } else if (v === 'noprog') {
        useNewFamily();
        S.athletes.push({
          id: 'a9',
          name: 'Test Athlete',
          kind: 'Child',
          archived: false,
          life: ['wrestling_practice'],
        });
        dayOf('a9', TODAY);
      } else if (v === 'programs') S.screen = 'programs';
      else if (v === 'program' || v === 'start') {
        S.prog = 'p1';
        S.screen = 'program';
      } else if (v === 'workout' || v === 'picker2') {
        S.prog = 'p1';
        S.draft = JSON.parse(JSON.stringify(wk(prog('p1'), 'w2')));
        S.screen = 'workout';
        if (v === 'picker2') S.picker = { sel: {}, newOpen: false, q: '' };
      } else if (v === 'scratch') newProgram();
      else if (v === 'copy') {
        S.prog = 'p1';
        S.screen = 'program';
      } else if (v === 'order') dayOf('a1', TODAY);
      else if (v === 'copied') {
        S.prog = 'p3';
        if (
          !prog('p3').workouts.some(function (w) {
            return w.from;
          })
        ) {
          var cw = JSON.parse(JSON.stringify(wk(prog('p1'), 'w4')));
          cw.wid = 'w' + ++S.seq;
          cw.from = { prog: 'Family program', on: TODAY };
          prog('p3').workouts.push(cw);
          prog('p3').week[1].push({ label: 'Evening', wid: cw.wid });
        }
        S.screen = 'program';
      } else if (v === 'settings' || v === 'privacy') S.screen = v;
      render();
      window.scrollTo(0, 0);
      if (v === 'start') openStart();
      if (v === 'copy') {
        openCopy('w4');
        document.getElementById('cp-to').value = 'p3';
      }
      if (v === 'order') openOrder();
      if (v === 'clear') openClear();
    }
    document.getElementById('jump').addEventListener('change', function (ev) {
      if (ev.target.value) jump(ev.target.value);
      ev.target.value = '';
    });
    var foldMode = document.getElementById('foldmode'),
      foldSec = document.getElementById('foldsec');
    foldMode.addEventListener('change', function () {
      FOLD.mode = foldMode.value;
      FOLD.open = {};
      FOLD.seenOpen = {};
      render();
    });
    foldSec.addEventListener('change', function () {
      FOLD.sections = foldSec.checked;
      FOLD.open = {};
      FOLD.seenOpen = {};
      render();
    });
    var idsBox = document.getElementById('ids');
    try {
      idsBox.checked = localStorage.getItem(KEY + '-ids') === '1';
    } catch (e) {}
    function applyIds() {
      document.querySelector('.phone').classList.toggle('show-ids', idsBox.checked);
      try {
        localStorage.setItem(KEY + '-ids', idsBox.checked ? '1' : '0');
      } catch (e) {}
    }
    idsBox.addEventListener('change', applyIds);
    applyIds();
    document.getElementById('reset').addEventListener('click', function () {
      TODAY = REAL_TODAY;
      closeModal();
      S = seed();
      render();
      say('Data reset');
    });
    var start = (location.hash || '').replace('#', '');
    if (start) jump(start);
    else render();
  })();
</script>
